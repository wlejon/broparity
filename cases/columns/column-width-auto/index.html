<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>column-width-auto</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  /* column-width is a hint: the engine derives the count.
     #wide  700px: floor((700+20)/(180+20)) = 3 cols, used width 220.
     #narrow 500px: floor((500+20)/(180+20)) = 2 cols, used width 240.
     The .item divs fill their column, so their measured widths (220 vs
     240) assert the derived column sizing. */
  #wide, #narrow {
    column-width: 180px;
    column-gap: 20px;
    margin: 20px 0 0 20px;
    background: #f6f2ea;
  }
  #wide { width: 700px; }
  #narrow { width: 500px; }
  .item {
    height: 24px;
    margin: 0;
    font-size: 13px;
    line-height: 24px;
    background: #dce8f4;
  }
  .item:nth-of-type(even) { background: #e4f0da; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div id="wide">
    <div class="item" id="w1"><span class="w" style="width:32px"></span></div>
    <div class="item" id="w2"><span class="w" style="width:36px"></span></div>
    <div class="item" id="w3"><span class="w" style="width:40px"></span></div>
    <div class="item" id="w4"><span class="w" style="width:44px"></span></div>
    <div class="item" id="w5"><span class="w" style="width:48px"></span></div>
    <div class="item" id="w6"><span class="w" style="width:52px"></span></div>
    <div class="item" id="w7"><span class="w" style="width:56px"></span></div>
    <div class="item" id="w8"><span class="w" style="width:60px"></span></div>
    <div class="item" id="w9"><span class="w" style="width:64px"></span></div>
  </div>
  <div id="narrow">
    <div class="item" id="n1"><span class="w" style="width:32px; background:#8a5030"></span></div>
    <div class="item" id="n2"><span class="w" style="width:36px; background:#8a5030"></span></div>
    <div class="item" id="n3"><span class="w" style="width:40px; background:#8a5030"></span></div>
    <div class="item" id="n4"><span class="w" style="width:44px; background:#8a5030"></span></div>
    <div class="item" id="n5"><span class="w" style="width:48px; background:#8a5030"></span></div>
    <div class="item" id="n6"><span class="w" style="width:52px; background:#8a5030"></span></div>
    <div class="item" id="n7"><span class="w" style="width:56px; background:#8a5030"></span></div>
    <div class="item" id="n8"><span class="w" style="width:60px; background:#8a5030"></span></div>
  </div>
</body>
</html>
