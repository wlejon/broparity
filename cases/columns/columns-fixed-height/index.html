<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>columns-fixed-height</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #row {
    display: flex;
    margin: 20px;
  }
  /* Both panels: 380px wide, 180px tall, 3 columns, 10px gaps ->
     120px columns; six 45px blocks (270px of content).
     #auto (column-fill:auto) fills sequentially: a1-a4 pack column 1
     (4 x 45 = 180 exactly), a5-a6 start column 2, column 3 empty.
     #balance splits evenly: two blocks per column, b5 lands at the
     top of column 3 (x = 260). */
  .panel {
    width: 380px;
    height: 180px;
    column-count: 3;
    column-gap: 10px;
    background: #f6f2ea;
  }
  #auto { column-fill: auto; margin-right: 20px; }
  #balance { column-fill: balance; }
  .b {
    height: 45px;
    break-inside: avoid;
    font-size: 13px;
    line-height: 45px;
    text-align: center;
    color: #ffffff;
  }
  .b:nth-of-type(1) { background: #4a90d9; }
  .b:nth-of-type(2) { background: #4ab06a; }
  .b:nth-of-type(3) { background: #f0a030; }
  .b:nth-of-type(4) { background: #8a5ad9; }
  .b:nth-of-type(5) { background: #d94a6a; }
  .b:nth-of-type(6) { background: #3aa8a0; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div id="row">
    <div class="panel" id="auto">
      <div class="b" id="a1"><span class="w" style="width:32px"></span></div>
      <div class="b" id="a2"><span class="w" style="width:36px"></span></div>
      <div class="b" id="a3"><span class="w" style="width:40px"></span></div>
      <div class="b" id="a4"><span class="w" style="width:44px"></span></div>
      <div class="b" id="a5"><span class="w" style="width:48px"></span></div>
      <div class="b" id="a6"><span class="w" style="width:52px"></span></div>
    </div>
    <div class="panel" id="balance">
      <div class="b" id="b1"><span class="w" style="width:32px"></span></div>
      <div class="b" id="b2"><span class="w" style="width:36px"></span></div>
      <div class="b" id="b3"><span class="w" style="width:40px"></span></div>
      <div class="b" id="b4"><span class="w" style="width:44px"></span></div>
      <div class="b" id="b5"><span class="w" style="width:48px"></span></div>
      <div class="b" id="b6"><span class="w" style="width:52px"></span></div>
    </div>
  </div>
</body>
</html>
