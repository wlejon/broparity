<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>column-count-basic</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  /* 640px, 3 columns, 20px gaps -> each column is exactly 200px wide.
     12 single-line paragraphs of 28px each (336px of content) balance
     to 4 per column, so the container height is 112px. */
  #cols {
    width: 640px;
    margin: 20px;
    column-count: 3;
    column-gap: 20px;
    background: #f6f2ea;
  }
  #cols p {
    margin: 0;
    padding: 4px 6px;
    font-size: 14px;
    line-height: 20px;
    background: #dce8f4;
  }
  #cols p:nth-of-type(even) { background: #e4f0da; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div id="cols">
    <p id="p1"><span class="w" style="width:40px"></span> <span class="w" style="width:32px"></span></p>
    <p id="p2"><span class="w" style="width:40px"></span> <span class="w" style="width:36px"></span></p>
    <p id="p3"><span class="w" style="width:40px"></span> <span class="w" style="width:44px"></span></p>
    <p id="p4"><span class="w" style="width:40px"></span> <span class="w" style="width:38px"></span></p>
    <p id="p5"><span class="w" style="width:40px"></span> <span class="w" style="width:34px"></span></p>
    <p id="p6"><span class="w" style="width:40px"></span> <span class="w" style="width:28px"></span></p>
    <p id="p7"><span class="w" style="width:40px"></span> <span class="w" style="width:48px"></span></p>
    <p id="p8"><span class="w" style="width:40px"></span> <span class="w" style="width:42px"></span></p>
    <p id="p9"><span class="w" style="width:40px"></span> <span class="w" style="width:36px"></span></p>
    <p id="p10"><span class="w" style="width:40px"></span> <span class="w" style="width:30px"></span></p>
    <p id="p11"><span class="w" style="width:40px"></span> <span class="w" style="width:46px"></span></p>
    <p id="p12"><span class="w" style="width:40px"></span> <span class="w" style="width:44px"></span></p>
  </div>
</body>
</html>
