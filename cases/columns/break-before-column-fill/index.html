<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>break-before-column-fill</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .cols {
    column-count: 3;
    column-gap: 20px;
    width: 700px;
    height: 150px;
    margin: 10px;
    background: #f0f0f0;
  }
  .blockx { height: 30px; margin: 4px 0; background: #dddddd; color: #202020; font-size: 12px; line-height: 30px; }
  .force { break-before: column; background: #2e7d32; color: #ffffff; }

  #fill-auto { column-fill: auto; }
  #fill-balance { column-fill: balance; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <!-- break-before: column forces the third block into a new column -->
  <div class="cols" id="fill-auto">
    <div class="blockx"><span class="w" style="width:36px"></span></div>
    <div class="blockx"><span class="w" style="width:44px"></span></div>
    <div class="blockx force"><span class="w" style="width:88px; background:#c8e4c8"></span></div>
    <div class="blockx"><span class="w" style="width:40px"></span></div>
    <div class="blockx"><span class="w" style="width:48px"></span></div>
  </div>
  <!-- balance spreads content evenly across the 3 columns -->
  <div class="cols" id="fill-balance">
    <div class="blockx"><span class="w" style="width:36px"></span></div>
    <div class="blockx"><span class="w" style="width:44px"></span></div>
    <div class="blockx"><span class="w" style="width:52px"></span></div>
    <div class="blockx"><span class="w" style="width:40px"></span></div>
    <div class="blockx"><span class="w" style="width:48px"></span></div>
    <div class="blockx"><span class="w" style="width:56px"></span></div>
  </div>
</body>
</html>
