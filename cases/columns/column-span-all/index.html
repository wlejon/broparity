<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>column-span-all</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  /* 640px, 3 columns, 20px gap -> 200px columns. Six 40px blocks
     before the spanner balance to 2 per column (80px tall row); the
     h2 spans all columns at full 640px width below them (y = 88 with
     its 8px margin); six more blocks rebalance below the spanner. */
  #spancols {
    width: 640px;
    margin: 20px;
    column-count: 3;
    column-gap: 20px;
    background: #f6f2ea;
  }
  .pre, .post {
    height: 40px;
    font-size: 13px;
    line-height: 40px;
    text-align: center;
  }
  .pre  { background: #dce8f4; }
  .pre:nth-of-type(even) { background: #c2d8ee; }
  .post { background: #e4f0da; }
  #spancols .post:nth-of-type(even) { background: #cfe4bc; }
  #spanner {
    column-span: all;
    margin: 8px 0;
    height: 32px;
    font-size: 18px;
    line-height: 32px;
    text-align: center;
    background: #b0483c;
    color: #ffffff;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div id="spancols">
    <div class="pre" id="a1"><span class="w" style="width:32px"></span></div>
    <div class="pre" id="a2"><span class="w" style="width:36px"></span></div>
    <div class="pre" id="a3"><span class="w" style="width:40px"></span></div>
    <div class="pre" id="a4"><span class="w" style="width:44px"></span></div>
    <div class="pre" id="a5"><span class="w" style="width:48px"></span></div>
    <div class="pre" id="a6"><span class="w" style="width:52px"></span></div>
    <h2 id="spanner"><span class="w" style="width:120px; background:#e8d0cc"></span></h2>
    <div class="post" id="b1"><span class="w" style="width:32px; background:#3a6a4a"></span></div>
    <div class="post" id="b2"><span class="w" style="width:36px; background:#3a6a4a"></span></div>
    <div class="post" id="b3"><span class="w" style="width:40px; background:#3a6a4a"></span></div>
    <div class="post" id="b4"><span class="w" style="width:44px; background:#3a6a4a"></span></div>
    <div class="post" id="b5"><span class="w" style="width:48px; background:#3a6a4a"></span></div>
    <div class="post" id="b6"><span class="w" style="width:52px; background:#3a6a4a"></span></div>
  </div>
</body>
</html>
