<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>grid-area-spans</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #g { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: 80px 80px; width: 300px; margin: 20px; background: #eeeeee; }
   #g > div { background: #c0d0e0; }
   #a { grid-column: 1 / 3; background: #c0d0e0; }
   #b { background: #d0e0c0; }
   #c { grid-row: 1 / 3; grid-column: 3; background: #e0c0d0; }
</style>
</head>
<body>
<div id="g"><div id="a"></div><div id="b"></div><div id="c"></div></div>
</body>
</html>
