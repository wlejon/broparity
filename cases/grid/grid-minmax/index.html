<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>grid-minmax</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #g { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(150px, 2fr) minmax(80px, 1fr);
        width: 600px; height: 100px; margin: 20px; background: #eeeeee; }
   #g > div { background: #c0d0e0; height: 100px; }
   #g > div:nth-child(2) { background: #d0e0c0; }
   #g > div:nth-child(3) { background: #e0c0d0; }
</style>
</head>
<body>
<div id="g"><div></div><div></div><div></div></div>
</body>
</html>
