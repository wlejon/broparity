<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>grid-named-areas</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #g { display: grid; grid-template-columns: 100px 200px; grid-template-rows: 50px 100px 40px;
        grid-template-areas: "header header" "side  main" "footer footer";
        width: 300px; margin: 20px; background: #eeeeee; }
   #h { grid-area: header; background: #c0d0e0; }
   #s { grid-area: side; background: #d0e0c0; }
   #m { grid-area: main; background: #e0c0d0; }
   #f { grid-area: footer; background: #c0e0e0; }
</style>
</head>
<body>
<div id="g"><div id="h"></div><div id="s"></div><div id="m"></div><div id="f"></div></div>
</body>
</html>
