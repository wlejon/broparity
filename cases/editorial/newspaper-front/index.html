<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>newspaper-front</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #fbfaf7; }
  .page { width: 800px; height: 600px; overflow: hidden; padding: 22px 26px; box-sizing: border-box; }
  .masthead { text-align: center; border-bottom: 3px double #1a1a1a; padding-bottom: 12px; margin-bottom: 6px; }
  .title { display: inline-block; width: 440px; height: 32px; background: #14110c; border-radius: 3px; }
  .subrule { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a; padding: 5px 0; margin-bottom: 16px; }
  .tag { width: 90px; height: 8px; background: #9b958a; border-radius: 4px; }
  .headline { width: 90%; height: 22px; background: #14110c; border-radius: 3px; margin: 0 auto 4px; }
  .headline.l2 { width: 60%; }
  .lead { margin-top: 12px; line-height: 15px; }
  .fig { float: left; width: 230px; height: 150px; background: linear-gradient(135deg, #9ca3af, #4b5563); border: 1px solid #d6d3cc; margin: 2px 16px 8px 0; }
  .cap { width: 200px; height: 7px; background: #c9c4ba; border-radius: 3px; margin-top: 6px; }
  .w { display: inline-block; height: 7px; background: #b7b2a6; border-radius: 3px; vertical-align: middle; margin: 0 5px 8px 0; }
  .w2 { width: 18px } .w3 { width: 28px } .w4 { width: 40px } .w5 { width: 52px } .w6 { width: 64px } .w7 { width: 78px }
  .body { column-count: 3; column-gap: 22px; column-rule: 1px solid #d6d2c8; line-height: 15px; margin-top: 16px; }
  .deck { column-span: all; width: 50%; height: 12px; background: #6b6459; border-radius: 4px; margin: 0 0 12px; }
</style>
</head>
<body>
<div class="page">
  <div class="masthead">
    <div class="title"></div>
  </div>
  <div class="subrule"><div class="tag"></div><div class="tag"></div></div>
  <div class="headline"></div>
  <div class="headline l2"></div>
  <div class="lead">
    <div class="fig"></div>
    <i class="w w5"></i><i class="w w3"></i><i class="w w6"></i><i class="w w4"></i><i class="w w7"></i><i class="w w3"></i><i class="w w5"></i><i class="w w4"></i><i class="w w6"></i><i class="w w2"></i><i class="w w5"></i><i class="w w7"></i><i class="w w3"></i><i class="w w4"></i><i class="w w6"></i><i class="w w5"></i><i class="w w3"></i><i class="w w7"></i><i class="w w4"></i><i class="w w5"></i><i class="w w6"></i><i class="w w3"></i><i class="w w4"></i><i class="w w7"></i><i class="w w5"></i><i class="w w2"></i><i class="w w6"></i><i class="w w4"></i><i class="w w5"></i><i class="w w3"></i><i class="w w6"></i><i class="w w7"></i><i class="w w4"></i><i class="w w5"></i>
  </div>
  <div class="body">
    <div class="deck"></div>
    <i class="w w4"></i><i class="w w6"></i><i class="w w3"></i><i class="w w5"></i><i class="w w7"></i><i class="w w4"></i><i class="w w3"></i><i class="w w6"></i><i class="w w5"></i><i class="w w4"></i><i class="w w2"></i><i class="w w6"></i><i class="w w5"></i><i class="w w3"></i><i class="w w7"></i><i class="w w4"></i><i class="w w5"></i><i class="w w6"></i><i class="w w3"></i><i class="w w4"></i><i class="w w5"></i><i class="w w7"></i><i class="w w3"></i><i class="w w6"></i><i class="w w4"></i><i class="w w5"></i><i class="w w2"></i><i class="w w6"></i><i class="w w4"></i><i class="w w7"></i><i class="w w3"></i><i class="w w5"></i><i class="w w6"></i><i class="w w4"></i><i class="w w3"></i><i class="w w5"></i><i class="w w7"></i><i class="w w4"></i><i class="w w6"></i><i class="w w3"></i><i class="w w5"></i><i class="w w4"></i><i class="w w6"></i><i class="w w7"></i><i class="w w3"></i><i class="w w5"></i><i class="w w4"></i><i class="w w6"></i>
  </div>
</div>
</body>
</html>
