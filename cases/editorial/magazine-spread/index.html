<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>magazine-spread</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #fff; }
  .page { width: 800px; height: 600px; overflow: hidden; padding: 30px 40px; box-sizing: border-box; }
  .kicker { width: 120px; height: 10px; background: #e11d48; border-radius: 5px; margin-bottom: 14px; }
  .title { width: 70%; height: 26px; background: #111; border-radius: 4px; margin-bottom: 6px; }
  .title.l2 { width: 45%; }
  .article { margin-top: 22px; line-height: 16px; }
  .dropcap { float: left; width: 64px; height: 64px; background: linear-gradient(135deg, #e11d48, #9f1239); border-radius: 6px; margin: 2px 12px 4px 0; }
  .blob { float: right; width: 170px; height: 170px; background: radial-gradient(circle at 35% 35%, #fda4af, #e11d48); border-radius: 50%; shape-outside: circle(50%); -webkit-shape-outside: circle(50%); margin: 0 0 10px 16px; }
  .quote { float: left; width: 200px; padding: 14px 0; border-top: 3px solid #e11d48; border-bottom: 3px solid #e11d48; margin: 8px 18px 10px 0; }
  .q-line { height: 11px; background: #4b5563; border-radius: 5px; margin-bottom: 8px; }
  .q-line.a { width: 95% } .q-line.b { width: 80% } .q-line.c { width: 60% }
  .w { display: inline-block; height: 7px; background: #c7c7cc; border-radius: 3px; vertical-align: middle; margin: 0 5px 9px 0; }
  .w2 { width: 18px } .w3 { width: 30px } .w4 { width: 42px } .w5 { width: 54px } .w6 { width: 66px } .w7 { width: 80px }
</style>
</head>
<body>
<div class="page">
  <div class="kicker"></div>
  <div class="title"></div>
  <div class="title l2"></div>
  <div class="article">
    <div class="dropcap"></div>
    <div class="blob"></div>
    <i class="w w5"></i><i class="w w3"></i><i class="w w6"></i><i class="w w4"></i><i class="w w7"></i><i class="w w3"></i><i class="w w5"></i><i class="w w4"></i><i class="w w6"></i><i class="w w2"></i><i class="w w5"></i><i class="w w7"></i><i class="w w3"></i><i class="w w4"></i><i class="w w6"></i><i class="w w5"></i><i class="w w3"></i><i class="w w7"></i><i class="w w4"></i><i class="w w5"></i><i class="w w6"></i><i class="w w3"></i>
    <div class="quote"><div class="q-line a"></div><div class="q-line b"></div><div class="q-line c"></div></div>
    <i class="w w4"></i><i class="w w6"></i><i class="w w3"></i><i class="w w5"></i><i class="w w7"></i><i class="w w4"></i><i class="w w3"></i><i class="w w6"></i><i class="w w5"></i><i class="w w4"></i><i class="w w2"></i><i class="w w6"></i><i class="w w5"></i><i class="w w3"></i><i class="w w7"></i><i class="w w4"></i><i class="w w5"></i><i class="w w6"></i><i class="w w3"></i><i class="w w4"></i><i class="w w5"></i><i class="w w7"></i><i class="w w3"></i><i class="w w6"></i><i class="w w4"></i><i class="w w5"></i><i class="w w2"></i><i class="w w6"></i><i class="w w4"></i><i class="w w7"></i><i class="w w3"></i><i class="w w5"></i><i class="w w6"></i><i class="w w4"></i>
  </div>
</div>
</body>
</html>
