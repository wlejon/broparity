<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>box-shadow-multiple</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #b { width: 200px; height: 100px; margin: 30px; background: #ffffff; box-shadow: 4px 4px 0 #c00000, 8px 8px 0 #c08000, 12px 12px 0 #008000; }
</style>
</head>
<body>
<div id="b"></div>
</body>
</html>
