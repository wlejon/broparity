<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>border-styles</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #row { display: flex; gap: 16px; margin: 20px; }
   .b { width: 100px; height: 60px; border: 4px #404040; background: #f0f0f0; }
</style>
</head>
<body>
<div id="row"><div class="b" style="border-style: solid"></div><div class="b" style="border-style: dashed"></div><div class="b" style="border-style: dotted"></div><div class="b" style="border-style: double; border-width: 6px"></div></div>
</body>
</html>
