<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>whitespace-pre</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; font-family: monospace; }
  #pre {
    margin: 20px;
    font-size: 14px;
    line-height: 1.4;
    background: #f0f0ff;
    white-space: pre;
  }
</style>
</head>
<body>
<pre id="pre">first    line   with    multiple    spaces
	tabbed line (one leading tab)
		double-tabbed line
line with    inner   spaces
last line</pre>
</body>
</html>
