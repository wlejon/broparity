<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>font-shorthand</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
  #p {
    margin: 20px;
    width: 400px;
    font: 14px/1.4 Arial, sans-serif;
    background: #f0f0ff;
  }
</style>
</head>
<body>
  <p id="p">font shorthand: 14px size, 1.4 line-height, Arial. Two lines minimum to expose any line-height drift in shorthand parsing. Three lines is even better for accumulating drift.</p>
</body>
</html>
