<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>font-size-cascade</title>
<style>
  html { font-size: 16px; }
  body { margin: 0; padding: 20px; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 1rem; }
  #outer { font-size: 1.25em; background: #fff0f0; }
  #middle { font-size: 1.5em; background: #f0fff0; }
  #inner { font-size: 0.5rem; background: #f0f0ff; }
</style>
</head>
<body>
  <div id="outer">outer 1.25em (=20px)
    <div id="middle">middle 1.5em (=30px)
      <div id="inner">inner 0.5rem (=8px)</div>
    </div>
  </div>
</body>
</html>
