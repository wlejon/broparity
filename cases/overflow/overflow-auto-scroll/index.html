<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>overflow-auto-scroll</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #outer { width: 200px; height: 100px; margin: 30px; background: #eeeeee; overflow: auto; }
   #inner { width: 400px; height: 300px; background: linear-gradient(45deg, #c00000, #0000c0); }
</style>
</head>
<body>
<div id="outer"><div id="inner"></div></div>
</body>
</html>
