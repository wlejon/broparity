<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>overflow-x-y-different</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #outer { width: 200px; height: 100px; margin: 30px; background: #eeeeee; overflow-x: hidden; overflow-y: visible; }
   #inner { width: 300px; height: 200px; background: rgba(0,128,0,0.5); }
</style>
</head>
<body>
<div id="outer"><div id="inner"></div></div>
</body>
</html>
