<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>overflow-visible</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #outer { width: 200px; height: 100px; margin: 30px; background: #eeeeee; overflow: visible; }
   #inner { width: 300px; height: 150px; background: rgba(192,0,0,0.6); }
</style>
</head>
<body>
<div id="outer"><div id="inner"></div></div>
</body>
</html>
