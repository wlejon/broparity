<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>text-overflow-ellipsis</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #b { width: 120px; margin: 30px; padding: 8px; background: #f0f0f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
</style>
</head>
<body>
<div id="b">averylongwordthatdoesnotwrap</div>
</body>
</html>
