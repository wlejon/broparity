<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>not-selector-list</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .item { width: 240px; height: 36px; margin: 8px; background: #dddddd; color: #202020; line-height: 18px; }
  .w { display: inline-block; height: 12px; vertical-align: top; background: #b04030; }

  /* simple :not */
  .item:not(.skip) { background: #2e7d32; color: #ffffff; }
  /* :not with selector list — matches elements that are neither p nor .special */
  div.item:not(.skip, .special) { width: 320px; }
  /* :not(:first-child) */
  .group .item:not(:first-child) { margin-left: 40px; }
</style>
</head>
<body>
  <div class="item"><span class="w" style="width:60px"></span> <span class="w" style="width:44px"></span></div>
  <div class="item skip"><span class="w" style="width:48px"></span> <span class="w" style="width:72px"></span></div>
  <div class="item special"><span class="w" style="width:56px"></span> <span class="w" style="width:36px"></span></div>
  <div class="group">
    <div class="item"><span class="w" style="width:64px"></span> <span class="w" style="width:40px"></span></div>
    <div class="item"><span class="w" style="width:52px"></span> <span class="w" style="width:76px"></span></div>
    <div class="item"><span class="w" style="width:44px"></span> <span class="w" style="width:68px"></span></div>
  </div>
</body>
</html>
