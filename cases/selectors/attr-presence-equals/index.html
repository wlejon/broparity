<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>attr-presence-equals</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .row { width: 200px; height: 40px; margin: 10px; background: #dddddd; color: #202020; line-height: 20px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }

  /* presence */
  .row[data-on] { background: #2e7d32; color: #ffffff; }
  /* exact match */
  .row[data-kind="alpha"] { background: #1565c0; color: #ffffff; width: 260px; }
  /* exact match must NOT hit a different value */
  .row[data-kind="beta"] { background: #c62828; color: #ffffff; width: 320px; }
  /* dash match: en and en-US, not enx */
  .row[lang|="en"] { background: #6a1b9a; color: #ffffff; height: 56px; }
  /* case-insensitive flag */
  .row[data-ci="MiXeD" i] { background: #ef6c00; color: #ffffff; width: 380px; }
</style>
</head>
<body>
  <div class="row" data-on><span class="w" style="width:56px"></span> <span class="w" style="width:36px"></span></div>
  <div class="row"><span class="w" style="width:48px"></span> <span class="w" style="width:72px"></span></div>
  <div class="row" data-kind="alpha"><span class="w" style="width:64px"></span> <span class="w" style="width:40px"></span></div>
  <div class="row" data-kind="beta"><span class="w" style="width:52px"></span> <span class="w" style="width:80px"></span></div>
  <div class="row" data-kind="alphabet"><span class="w" style="width:44px"></span> <span class="w" style="width:60px"></span></div>
  <div class="row" lang="en"><span class="w" style="width:68px"></span> <span class="w" style="width:32px"></span></div>
  <div class="row" lang="en-US"><span class="w" style="width:56px"></span> <span class="w" style="width:48px"></span></div>
  <div class="row" lang="enx"><span class="w" style="width:40px"></span> <span class="w" style="width:76px"></span></div>
  <div class="row" data-ci="mixed"><span class="w" style="width:60px"></span> <span class="w" style="width:44px"></span></div>
  <div class="row" data-ci="MIXED"><span class="w" style="width:72px"></span> <span class="w" style="width:36px"></span></div>
</body>
</html>
