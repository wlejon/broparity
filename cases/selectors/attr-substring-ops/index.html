<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>attr-substring-ops</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .row { width: 220px; height: 36px; margin: 8px; background: #dddddd; color: #202020; line-height: 18px; }
  .w { display: inline-block; height: 12px; vertical-align: top; background: #b04030; }

  /* prefix */
  .row[href^="https://"] { background: #2e7d32; color: #ffffff; width: 280px; }
  /* suffix */
  .row[href$=".pdf"] { background: #1565c0; color: #ffffff; height: 52px; }
  /* substring */
  .row[href*="example"] { border-left: 12px solid #ef6c00; }
  /* whitespace list word */
  .row[data-tags~="hot"] { background: #c62828; color: #ffffff; width: 340px; }
  /* ~= must not match substrings of a word */
  .row[data-tags~="ho"] { background: #000000; height: 90px; }
</style>
</head>
<body>
  <div class="row" href="https://example.com/a"><span class="w" style="width:56px"></span> <span class="w" style="width:40px"></span></div>
  <div class="row" href="http://other.org/b"><span class="w" style="width:48px"></span> <span class="w" style="width:72px"></span></div>
  <div class="row" href="https://files.org/doc.pdf"><span class="w" style="width:64px"></span> <span class="w" style="width:36px"></span></div>
  <div class="row" href="file.pdfx"><span class="w" style="width:52px"></span> <span class="w" style="width:80px"></span></div>
  <div class="row" data-tags="new hot sale"><span class="w" style="width:44px"></span> <span class="w" style="width:60px"></span></div>
  <div class="row" data-tags="hotel"><span class="w" style="width:68px"></span> <span class="w" style="width:32px"></span></div>
  <div class="row" data-tags=""><span class="w" style="width:56px"></span> <span class="w" style="width:44px"></span></div>
</body>
</html>
