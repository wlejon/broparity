<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>structural-pseudos</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .list { margin: 8px; padding: 4px; background: #f0f0f0; }
  .list div, .list p { width: 220px; height: 26px; margin: 4px; background: #dddddd; color: #202020; font-size: 13px; line-height: 18px; }
  .w { display: inline-block; height: 12px; vertical-align: top; background: #b04030; }

  .list :first-child { background: #2e7d32; color: #ffffff; }
  .list :last-child { background: #1565c0; color: #ffffff; }
  .only :only-child { background: #6a1b9a; color: #ffffff; width: 300px; }
  .list :empty { background: #c62828; height: 14px; }
  .mixed p:first-of-type { border-left: 12px solid #ef6c00; }
  .mixed p:last-of-type { border-left: 12px solid #2e7d32; }
  .mixed div:only-of-type { width: 320px; }
</style>
</head>
<body>
  <div class="list">
    <div><span class="w" style="width:60px"></span> <span class="w" style="width:44px"></span></div>
    <div><span class="w" style="width:48px"></span> <span class="w" style="width:72px"></span></div>
    <div></div>
    <div><span class="w" style="width:56px"></span> <span class="w" style="width:36px"></span></div>
  </div>
  <div class="list only">
    <div><span class="w" style="width:64px"></span> <span class="w" style="width:40px"></span></div>
  </div>
  <div class="list mixed">
    <p><span class="w" style="width:52px"></span> <span class="w" style="width:76px"></span></p>
    <div><span class="w" style="width:44px"></span> <span class="w" style="width:60px"></span></div>
    <p><span class="w" style="width:68px"></span> <span class="w" style="width:32px"></span></p>
    <p><span class="w" style="width:56px"></span> <span class="w" style="width:48px"></span></p>
  </div>
</body>
</html>
