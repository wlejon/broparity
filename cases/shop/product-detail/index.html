<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>product-detail</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #fff; }
  .page { width: 800px; height: 600px; overflow: hidden; }
  .topbar { height: 52px; padding: 0 28px; display: flex; align-items: center; border-bottom: 1px solid #eee; }
  .brand { width: 90px; height: 18px; background: #111; border-radius: 4px; }
  .cart { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; background: #f0f0f0; }
  .detail { display: flex; gap: 36px; padding: 32px 28px; }
  .gallery { width: 360px; }
  .main-img { width: 360px; height: 320px; background: linear-gradient(135deg, #a1c4fd, #c2e9fb); border-radius: 14px; margin-bottom: 14px; }
  .thumbs { display: flex; gap: 12px; }
  .thumb { width: 78px; height: 78px; border-radius: 8px; background: #e8eef7; }
  .thumb.sel { border: 2px solid #2b6cff; }
  .info { flex: 1; }
  .crumb { width: 120px; height: 9px; background: #cfcfcf; border-radius: 4px; margin-bottom: 18px; }
  .title { height: 24px; background: #16181d; border-radius: 5px; margin-bottom: 8px; }
  .title.l1 { width: 90%; }
  .title.l2 { width: 60%; }
  .stars { display: flex; gap: 5px; margin: 16px 0; }
  .star { width: 16px; height: 16px; border-radius: 3px; background: #ffb02e; }
  .star.off { background: #e0e0e0; }
  .price { width: 110px; height: 30px; background: #111; border-radius: 6px; margin: 18px 0; }
  .desc { height: 9px; background: #d6d6d6; border-radius: 4px; margin-bottom: 9px; }
  .desc.w1 { width: 100%; }
  .desc.w2 { width: 92%; }
  .desc.w3 { width: 70%; }
  .opts { display: flex; gap: 10px; margin: 22px 0; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; }
  .swatch.a { background: #2b6cff; }
  .swatch.b { background: #e63946; }
  .swatch.c { background: #2ec5a3; }
  .swatch.d { background: #1a1a1a; }
  .actions { display: flex; gap: 14px; margin-top: 24px; }
  .buy { width: 200px; height: 50px; background: #2b6cff; border-radius: 10px; box-shadow: 0 8px 20px rgba(43,108,255,0.3); }
  .wish { width: 50px; height: 50px; border: 1px solid #d0d0d0; border-radius: 10px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><div class="brand"></div><div class="cart"></div></div>
  <div class="detail">
    <div class="gallery">
      <div class="main-img"></div>
      <div class="thumbs">
        <div class="thumb sel"></div>
        <div class="thumb"></div>
        <div class="thumb"></div>
        <div class="thumb"></div>
      </div>
    </div>
    <div class="info">
      <div class="crumb"></div>
      <div class="title l1"></div>
      <div class="title l2"></div>
      <div class="stars"><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star off"></div></div>
      <div class="price"></div>
      <div class="desc w1"></div>
      <div class="desc w2"></div>
      <div class="desc w3"></div>
      <div class="opts"><div class="swatch a"></div><div class="swatch b"></div><div class="swatch c"></div><div class="swatch d"></div></div>
      <div class="actions"><div class="buy"></div><div class="wish"></div></div>
    </div>
  </div>
</div>
</body>
</html>
