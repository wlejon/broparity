<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>box-sizing-border-box</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; line-height: 20px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  #content-box {
    box-sizing: content-box;
    width: 200px;
    padding: 20px;
    border: 6px solid #008060;
    background: #d0f0e0;
    margin: 20px;
  }
  #border-box {
    box-sizing: border-box;
    width: 200px;
    padding: 20px;
    border: 6px solid #804000;
    background: #f0e0d0;
    margin: 20px;
  }
</style>
</head>
<body>
  <div id="content-box"><span class="w" style="width:64px"></span> <span class="w" style="width:44px"></span> <span class="w" style="width:72px"></span> <span class="w" style="width:36px"></span></div>
  <div id="border-box"><span class="w" style="width:56px"></span> <span class="w" style="width:80px"></span> <span class="w" style="width:40px"></span></div>
</body>
</html>
