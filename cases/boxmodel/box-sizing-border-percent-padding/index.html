<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>box-sizing-border-percent-padding</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; margin: 20px; background: #eeeeee; }
   #b { box-sizing: border-box; width: 100%; padding: 10%; border: 4px solid #404040; background: #c0d0e0; }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
