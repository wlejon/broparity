<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>margin-collapse</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .stacked {
    width: 300px;
    height: 60px;
    margin-left: 40px;
    margin-top: 40px;
    margin-bottom: 40px;
    background: #c8e6ff;
    border: 2px solid #2060a0;
    color: #102030;
    line-height: 20px;
  }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
</style>
</head>
<body>
  <div class="stacked" id="a"><span class="w" style="width:48px"></span> <span class="w" style="width:64px"></span></div>
  <div class="stacked" id="b"><span class="w" style="width:56px"></span> <span class="w" style="width:40px"></span></div>
</body>
</html>
