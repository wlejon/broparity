<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>basic-block</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #box {
    width: 240px;
    margin: 30px;
    padding: 20px;
    border: 4px solid #c00000;
    background: #ffe0e0;
    color: #202020;
    font-size: 16px;
    line-height: 20px;
  }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
</style>
</head>
<body>
  <div id="box"><span class="w" style="width:56px"></span> <span class="w" style="width:72px"></span> <span class="w" style="width:40px"></span> <span class="w" style="width:64px"></span> <span class="w" style="width:48px"></span> <span class="w" style="width:80px"></span></div>
</body>
</html>
