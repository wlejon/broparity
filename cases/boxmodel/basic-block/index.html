<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>basic-block</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #box {
    width: 240px;
    margin: 30px;
    padding: 20px;
    border: 4px solid #c00000;
    background: #ffe0e0;
    color: #202020;
    font-size: 16px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div id="box">basic block with margin / padding / border</div>
</body>
</html>
