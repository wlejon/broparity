<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>negative-margin</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; margin: 20px; background: #eeeeee; padding: 20px; }
   #a { width: 200px; height: 60px; background: #c00000; }
   #b { width: 200px; height: 60px; background: #0000c0; margin-top: -20px; margin-left: 30px; }
</style>
</head>
<body>
<div id="root"><div id="a"></div><div id="b"></div></div>
</body>
</html>
