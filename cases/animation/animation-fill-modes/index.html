<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>animation-fill-modes</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .box { width: 200px; height: 40px; margin: 12px; background: #dddddd; color: #202020; font-size: 12px; }

  @keyframes paint {
    from { background-color: rgb(21, 101, 192); width: 300px; }
    to   { background-color: rgb(198, 40, 40); width: 400px; }
  }

  /* paused before start (positive delay, delay phase):
     backwards/both show the from-frame; none keeps base style */
  #backwards { animation: paint 2s linear 100s paused backwards; color: #ffffff; }
  #both      { animation: paint 2s linear 100s paused both; color: #ffffff; }
  #none      { animation: paint 2s linear 100s paused none; }
</style>
</head>
<body>
  <div class="box" id="backwards">backwards → from-frame (blue, 300)</div>
  <div class="box" id="both">both → from-frame (blue, 300)</div>
  <div class="box" id="none">none → base (grey, 200)</div>
</body>
</html>
