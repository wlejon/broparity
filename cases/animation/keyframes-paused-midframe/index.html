<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>keyframes-paused-midframe</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .box { width: 120px; height: 40px; margin: 12px; background: #dddddd; color: #202020; font-size: 12px; line-height: 20px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }

  /* Paused + negative delay pins a deterministic mid-animation frame.
     linear timing, exact fractions → exact interpolated values. */
  @keyframes slide {
    from { transform: translateX(0px); }
    to   { transform: translateX(400px); }
  }
  @keyframes recolor {
    from { background-color: rgb(0, 0, 255); }
    to   { background-color: rgb(0, 0, 55); }
  }
  @keyframes grow {
    from { width: 100px; }
    to   { width: 500px; }
  }

  #t25 { animation: slide 4s linear -1s paused; }
  #t50 { animation: slide 4s linear -2s paused; }
  #t75 { animation: slide 4s linear -3s paused; }
  #color-half { animation: recolor 2s linear -1s paused; color: #ffffff; }
  #width-half { animation: grow 2s linear -1s paused; }
</style>
</head>
<body>
  <div class="box" id="t25"><span class="w" style="width:32px"></span> <span class="w" style="width:48px"></span></div>
  <div class="box" id="t50"><span class="w" style="width:36px"></span> <span class="w" style="width:44px"></span></div>
  <div class="box" id="t75"><span class="w" style="width:40px"></span> <span class="w" style="width:40px"></span></div>
  <div class="box" id="color-half"><span class="w" style="width:32px"></span> <span class="w" style="width:36px"></span></div>
  <div class="box" id="width-half"><span class="w" style="width:32px"></span> <span class="w" style="width:52px"></span></div>
</body>
</html>
