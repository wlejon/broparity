<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>icon-grid</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #f8fafc; }
  .page { width: 800px; height: 600px; overflow: hidden; }
  .bar { height: 56px; padding: 0 28px; display: flex; align-items: center; background: #fff; border-bottom: 1px solid #e6eaf0; }
  .brand { width: 100px; height: 18px; background: #0f172a; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 100px; padding: 18px; gap: 12px; }
  .tile { background: #fff; border: 1px solid #eaecf0; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  svg { display: block; }
  .stroke { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="page">
  <div class="bar"><div class="brand"></div></div>
  <div class="grid">
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M12 5v14M5 12h14"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M5 13l4 4L19 7"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M6 6l12 12M18 6L6 18"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M4 12h13M12 7l5 5-5 5"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L20 20"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M3 11l9-7 9 7M5 10v9h14v-9"/></g></svg></div>

    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M12 4a5 5 0 0 0-5 5v4l-2 3h14l-2-3V9a5 5 0 0 0-5-5z"/><path d="M10 20h4"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 8l9 6 9-6"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M12 4v10M8 11l4 4 4-4M5 19h14"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><path d="M12 4l9 16H3z"/></g></svg></div>

    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24">
      <defs><linearGradient id="g-heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient></defs>
      <path d="M12 20S4 14 4 8.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 8 2.5C20 14 12 20 12 20z" fill="url(#g-heart)"/></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24">
      <defs><linearGradient id="g-star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
      <polygon points="12,3 14.6,9.2 21,9.7 16,14 17.6,20.4 12,16.8 6.4,20.4 8,14 3,9.7 9.4,9.2" fill="url(#g-star)" fill-rule="evenodd"/></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="#334155"/></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><g class="stroke"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></g></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#cbd5e1" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 100" transform="rotate(-90 12 12)"/></svg></div>
    <div class="tile"><svg width="40" height="40" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 3"/></svg></div>
  </div>
</div>
</body>
</html>
