<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>chart-dashboard</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #0b1020; }
  .page { width: 800px; height: 600px; overflow: hidden; padding: 20px; box-sizing: border-box; }
  .row { display: flex; gap: 16px; margin-bottom: 16px; }
  .panel { background: #141b30; border: 1px solid #243049; border-radius: 12px; padding: 16px; }
  .t { width: 90px; height: 9px; background: #54618a; border-radius: 4px; margin-bottom: 14px; }
  .area { flex: 2; }
  .donut { flex: 1; }
  .bars { flex: 1; }
  svg { display: block; width: 100%; }
</style>
</head>
<body>
<div class="page">
  <div class="row">
    <div class="panel area">
      <div class="t"></div>
      <svg viewBox="0 0 460 180" height="180">
        <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="0" y1="45" x2="460" y2="45" stroke="#243049" stroke-width="1"/>
        <line x1="0" y1="90" x2="460" y2="90" stroke="#243049" stroke-width="1"/>
        <line x1="0" y1="135" x2="460" y2="135" stroke="#243049" stroke-width="1"/>
        <path d="M0 130 L66 95 L131 110 L197 60 L263 80 L329 35 L394 70 L460 40 L460 180 L0 180 Z" fill="url(#fill)"/>
        <path d="M0 130 L66 95 L131 110 L197 60 L263 80 L329 35 L394 70 L460 40" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="197" cy="60" r="4" fill="#0b1020" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="460" cy="40" r="4" fill="#0b1020" stroke="#38bdf8" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="panel donut">
      <div class="t"></div>
      <svg viewBox="0 0 140 160" height="180">
        <circle cx="70" cy="70" r="52" fill="none" stroke="#243049" stroke-width="18"/>
        <circle cx="70" cy="70" r="52" fill="none" stroke="#34d399" stroke-width="18" stroke-dasharray="130 327" transform="rotate(-90 70 70)"/>
        <circle cx="70" cy="70" r="52" fill="none" stroke="#fbbf24" stroke-width="18" stroke-dasharray="98 327" stroke-dashoffset="-130" transform="rotate(-90 70 70)"/>
        <circle cx="70" cy="70" r="52" fill="none" stroke="#f472b6" stroke-width="18" stroke-dasharray="70 327" stroke-dashoffset="-228" transform="rotate(-90 70 70)"/>
      </svg>
    </div>
  </div>
  <div class="row">
    <div class="panel bars">
      <div class="t"></div>
      <svg viewBox="0 0 220 150" height="150">
        <defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs>
        <rect x="10"  y="70"  width="26" height="80"  rx="4" fill="url(#bar)"/>
        <rect x="48"  y="40"  width="26" height="110" rx="4" fill="url(#bar)"/>
        <rect x="86"  y="95"  width="26" height="55"  rx="4" fill="url(#bar)"/>
        <rect x="124" y="25"  width="26" height="125" rx="4" fill="url(#bar)"/>
        <rect x="162" y="60"  width="26" height="90"  rx="4" fill="url(#bar)"/>
      </svg>
    </div>
    <div class="panel bars">
      <div class="t"></div>
      <svg viewBox="0 0 220 150" height="150">
        <path d="M110 18 A92 92 0 0 1 202 110" fill="none" stroke="#243049" stroke-width="16" stroke-linecap="round" transform="scale(1,1)"/>
        <g transform="translate(0,0)">
          <path d="M18 110 A92 92 0 0 1 110 18" fill="none" stroke="#243049" stroke-width="16" stroke-linecap="round"/>
          <path d="M18 110 A92 92 0 0 1 92 22" fill="none" stroke="#f97316" stroke-width="16" stroke-linecap="round"/>
        </g>
        <circle cx="110" cy="110" r="6" fill="#f97316"/>
        <line x1="110" y1="110" x2="150" y2="55" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
