<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>clip-paths</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #0b1020; }
  .page { width: 800px; height: 600px; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 190px; padding: 14px; gap: 14px; }
  .tile { background: #131a30; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  svg { display: block; }
  .cssClip { clip-path: url(#roundBox); }
</style>
</head>
<body>
<div class="page">
  <div class="grid">

    <!-- 1. userSpaceOnUse circle clip over a gradient rect (attribute form) -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f97316"/>
            <stop offset="1" stop-color="#db2777"/>
          </linearGradient>
          <clipPath id="c1" clipPathUnits="userSpaceOnUse">
            <circle cx="70" cy="70" r="55"/>
          </clipPath>
        </defs>
        <rect x="0" y="0" width="140" height="140" fill="url(#g1)" clip-path="url(#c1)"/>
      </svg>
    </div>

    <!-- 2. objectBoundingBox clip: star-ish polygon scaled to the shape bbox -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <clipPath id="c2" clipPathUnits="objectBoundingBox">
          <polygon points="0.5,0 0.62,0.38 1,0.38 0.69,0.62 0.81,1 0.5,0.76 0.19,1 0.31,0.62 0,0.38 0.38,0.38"/>
        </clipPath>
        <rect x="15" y="15" width="110" height="110" fill="#38bdf8" clip-path="url(#c2)"/>
      </svg>
    </div>

    <!-- 3. multi-shape clip (union of two circles) -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <clipPath id="c3">
          <circle cx="52" cy="70" r="42"/>
          <circle cx="92" cy="70" r="42"/>
        </clipPath>
        <rect x="0" y="0" width="140" height="140" fill="#34d399" clip-path="url(#c3)"/>
      </svg>
    </div>

    <!-- 4. evenodd donut clip (single child) -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <clipPath id="c4">
          <path clip-rule="evenodd" d="M70 12a58 58 0 1 0 0.001 0zM70 44a26 26 0 1 1 -0.001 0z"/>
        </clipPath>
        <rect x="0" y="0" width="140" height="140" fill="#a78bfa" clip-path="url(#c4)"/>
      </svg>
    </div>

    <!-- 5. clip on a GROUP (objectBoundingBox over the group's bbox) -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <clipPath id="c5" clipPathUnits="objectBoundingBox">
          <rect x="0.1" y="0.1" width="0.8" height="0.8" rx="0.18"/>
        </clipPath>
        <g clip-path="url(#c5)">
          <rect x="10" y="10" width="120" height="120" fill="#f43f5e"/>
          <rect x="10" y="10" width="60" height="120" fill="#fbbf24"/>
        </g>
      </svg>
    </div>

    <!-- 6. clip via a CSS class rule (not an attribute) -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <clipPath id="roundBox">
          <rect x="20" y="35" width="100" height="70" rx="22"/>
        </clipPath>
        <rect class="cssClip" x="0" y="0" width="140" height="140" fill="#22d3ee"/>
      </svg>
    </div>

    <!-- 7. clipPath with its own transform + userSpaceOnUse -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <clipPath id="c7" transform="rotate(45 70 70)">
          <rect x="30" y="30" width="80" height="80"/>
        </clipPath>
        <rect x="0" y="0" width="140" height="140" fill="#e879f9" clip-path="url(#c7)"/>
      </svg>
    </div>

    <!-- 8. nested transform: clipped shape sits under a group transform -->
    <div class="tile">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <clipPath id="c8" clipPathUnits="userSpaceOnUse">
          <circle cx="45" cy="45" r="38"/>
        </clipPath>
        <g transform="translate(25 25)">
          <rect x="0" y="0" width="90" height="90" fill="#4ade80" clip-path="url(#c8)"/>
        </g>
      </svg>
    </div>

  </div>
</div>
</body>
</html>
