<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pattern-mask-use</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  svg { display: block; margin: 10px; background: #f0f0f0; }
</style>
</head>
<body>
  <svg width="760" height="260" viewBox="0 0 760 260">
    <defs>
      <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
        <rect width="20" height="20" fill="#ffe0b2"/>
        <circle cx="10" cy="10" r="6" fill="#ef6c00"/>
      </pattern>
      <mask id="fade">
        <rect x="240" y="20" width="180" height="180" fill="#ffffff"/>
        <circle cx="330" cy="110" r="60" fill="#000000"/>
      </mask>
      <symbol id="badge" viewBox="0 0 40 40">
        <rect x="2" y="2" width="36" height="36" fill="#1565c0"/>
        <circle cx="20" cy="20" r="12" fill="#ffffff"/>
      </symbol>
      <g id="chip">
        <rect width="60" height="24" fill="#2e7d32"/>
        <rect x="6" y="6" width="12" height="12" fill="#ffffff"/>
      </g>
    </defs>

    <!-- pattern fill -->
    <rect x="20" y="20" width="180" height="180" fill="url(#dots)" stroke="#202020"/>

    <!-- mask: white keeps, black hole in the middle -->
    <rect x="240" y="20" width="180" height="180" fill="#6a1b9a" mask="url(#fade)"/>

    <!-- symbol + use at two sizes -->
    <use href="#badge" x="460" y="20" width="80" height="80"/>
    <use href="#badge" x="560" y="20" width="40" height="40"/>

    <!-- use of a plain group, translated -->
    <use href="#chip" x="460" y="140"/>
    <use href="#chip" x="540" y="180"/>
  </svg>
</body>
</html>
