<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>logo-wall</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #fff; }
  .page { width: 800px; height: 600px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .head { width: 280px; height: 12px; background: #cbd5e1; border-radius: 6px; }
  .wall { display: grid; grid-template-columns: repeat(4, 150px); grid-auto-rows: 110px; gap: 20px; }
  .cell { border: 1px solid #eef1f5; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  svg { display: block; }
</style>
</head>
<body>
<div class="page">
  <div class="head"></div>
  <div class="wall">
    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <defs><linearGradient id="l1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
      <circle cx="25" cy="25" r="16" fill="url(#l1)"/><rect x="44" y="16" width="38" height="18" rx="9" fill="#0f172a"/></svg></div>
    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <polygon points="20,8 36,42 4,42" fill="#f59e0b"/><polygon points="20,20 28,42 12,42" fill="#fff"/><rect x="46" y="20" width="36" height="10" rx="5" fill="#334155"/></svg></div>
    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <defs><radialGradient id="r1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></radialGradient></defs>
      <rect x="8" y="10" width="30" height="30" rx="8" fill="url(#r1)" transform="rotate(12 23 25)"/><circle cx="62" cy="25" r="14" fill="none" stroke="#7c3aed" stroke-width="5"/></svg></div>
    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <path d="M10 40 Q20 8 30 40 T50 40" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/><circle cx="68" cy="20" r="9" fill="#10b981"/></svg></div>

    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <g transform="translate(25 25)"><rect x="-12" y="-12" width="24" height="24" rx="6" fill="#ef4444"/><rect x="-12" y="-12" width="24" height="24" rx="6" fill="#fb923c" transform="rotate(45)" opacity="0.7"/></g>
      <rect x="46" y="18" width="36" height="14" rx="4" fill="#0f172a"/></svg></div>
    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <defs><linearGradient id="l2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs>
      <path d="M25 6 L40 16 V34 L25 44 L10 34 V16 Z" fill="url(#l2)"/><circle cx="25" cy="25" r="7" fill="#fff"/></svg></div>
    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <circle cx="22" cy="25" r="15" fill="none" stroke="#ec4899" stroke-width="5"/><circle cx="38" cy="25" r="15" fill="none" stroke="#8b5cf6" stroke-width="5" opacity="0.8"/><rect x="60" y="20" width="24" height="10" rx="5" fill="#334155"/></svg></div>
    <div class="cell"><svg width="90" height="50" viewBox="0 0 90 50">
      <polygon points="22,6 38,15 38,35 22,44 6,35 6,15" fill="#1d4ed8"/><polygon points="22,16 30,21 30,29 22,34 14,29 14,21" fill="#fff"/></svg></div>
  </div>
</div>
</body>
</html>
