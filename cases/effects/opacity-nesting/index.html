<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>opacity-nesting</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #pattern { width: 700px; padding: 20px; margin: 20px; background: repeating-linear-gradient(45deg, #bdbdbd 0 12px, #ffffff 12px 24px); }
  .chip { display: inline-block; vertical-align: top; width: 120px; height: 60px; margin-right: 24px; background: #d32f2f; }
  #half { opacity: 0.5; }
  #outer { display: inline-block; vertical-align: top; opacity: 0.5; }
  #innerchip { opacity: 0.5; margin-right: 0; }
  #stack { width: 200px; margin: 20px; }
  .slab { height: 40px; background: #1565c0; }
  #ghost { height: 40px; background: #2e7d32; opacity: 0; }
  #below { height: 40px; background: #f9a825; }
</style>
</head>
<body>
<div id="pattern">
  <div class="chip" id="full"></div>
  <div class="chip" id="half"></div>
  <div id="outer"><div class="chip" id="innerchip"></div></div>
</div>
<div id="stack">
  <div class="slab" id="above"></div>
  <div id="ghost"></div>
  <div id="below"></div>
</div>
</body>
</html>
