<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>filter-drop-shadow</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  img { display: inline-block; vertical-align: top; width: 120px; height: 100px; margin: 40px; }
  #ds { filter: drop-shadow(10px 10px 0 rgba(21, 101, 192, 0.9)); }
  #bs { box-shadow: 10px 10px 0 rgba(21, 101, 192, 0.9); }
</style>
</head>
<body>
<img id="ds" alt="" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='100'%3E%3Cpolygon%20points='60,0%20120,100%200,100'%20fill='%23c62828'/%3E%3C/svg%3E">
<img id="bs" alt="" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='100'%3E%3Cpolygon%20points='60,0%20120,100%200,100'%20fill='%23c62828'/%3E%3C/svg%3E">
</body>
</html>
