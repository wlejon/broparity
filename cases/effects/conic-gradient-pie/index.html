<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>conic-gradient-pie</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #pie { display: inline-block; vertical-align: top; width: 180px; height: 180px; margin: 30px; border-radius: 50%; background: conic-gradient(#e53935 0 90deg, #fdd835 90deg 210deg, #1e88e5 210deg 360deg); }
  #checker { display: inline-block; vertical-align: top; width: 180px; height: 180px; margin: 30px; background: repeating-conic-gradient(#37474f 0 15deg, #eceff1 15deg 30deg); }
</style>
</head>
<body>
<div id="pie"></div>
<div id="checker"></div>
</body>
</html>
