<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>background-blend-mode</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  .strip { width: 320px; height: 90px; margin: 20px; }
  #blend { background: linear-gradient(90deg, #ffffff, #000000) #ff9800; background-blend-mode: multiply; }
  #gradonly { background: linear-gradient(90deg, #ffffff, #000000); }
  #solidonly { background: #ff9800; }
</style>
</head>
<body>
<div class="strip" id="blend"></div>
<div class="strip" id="gradonly"></div>
<div class="strip" id="solidonly"></div>
</body>
</html>
