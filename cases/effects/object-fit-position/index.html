<html>
<head>
<meta charset="utf-8">
<title>object-fit-position</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  img { display: inline-block; vertical-align: top; width: 120px; height: 90px; margin: 24px 8px 24px 20px; background: #616161; }
  #fit-fill { object-fit: fill; }
  #fit-contain { object-fit: contain; }
  #fit-cover { object-fit: cover; }
  #fit-none { object-fit: none; }
  #fit-pos { object-fit: none; object-position: right bottom; }
</style>
