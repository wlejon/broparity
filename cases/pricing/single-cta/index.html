<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>single-cta</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; }
  .page { width: 800px; height: 600px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at top, #1e293b, #0f172a); }
  .card { width: 420px; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.4); }
  .banner { height: 80px; background: linear-gradient(120deg, #f59e0b, #ef4444); display: flex; align-items: center; justify-content: center; }
  .banner-tag { width: 120px; height: 16px; background: rgba(255,255,255,0.9); border-radius: 8px; }
  .inner { padding: 32px 36px 36px; }
  .plan { width: 90px; height: 12px; background: #64748b; border-radius: 5px; margin: 0 auto 16px; }
  .price { display: flex; align-items: flex-start; justify-content: center; gap: 4px; margin-bottom: 6px; }
  .cur { width: 14px; height: 18px; background: #0f172a; border-radius: 3px; margin-top: 6px; }
  .amount { width: 110px; height: 48px; background: #0f172a; border-radius: 8px; }
  .old { width: 70px; height: 12px; background: #cbd5e1; border-radius: 5px; margin: 0 auto 26px; }
  .feat { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
  .check { width: 20px; height: 20px; border-radius: 50%; background: #dcfce7; }
  .f-line { height: 10px; background: #cbd3df; border-radius: 5px; }
  .f-line.w1 { width: 75%; }
  .f-line.w2 { width: 88%; }
  .f-line.w3 { width: 64%; }
  .cta { width: 100%; height: 54px; background: linear-gradient(120deg, #f59e0b, #ef4444); border-radius: 12px; margin-top: 24px; box-shadow: 0 12px 24px rgba(239,68,68,0.35); }
  .note { width: 200px; height: 8px; background: #d4dae3; border-radius: 4px; margin: 16px auto 0; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="banner"><div class="banner-tag"></div></div>
    <div class="inner">
      <div class="plan"></div>
      <div class="price"><div class="cur"></div><div class="amount"></div></div>
      <div class="old"></div>
      <div class="feat"><div class="check"></div><div class="f-line w2"></div></div>
      <div class="feat"><div class="check"></div><div class="f-line w1"></div></div>
      <div class="feat"><div class="check"></div><div class="f-line w3"></div></div>
      <div class="feat"><div class="check"></div><div class="f-line w2"></div></div>
      <div class="cta"></div>
      <div class="note"></div>
    </div>
  </div>
</div>
</body>
</html>
