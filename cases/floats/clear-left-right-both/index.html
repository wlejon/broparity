<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>clear-left-right-both</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #wrap {
    width: 500px;
    margin: 20px;
    overflow: hidden;
    background: #f4f0e6;
    font-size: 14px;
    line-height: 24px;
  }
  #fl {
    float: left;
    width: 120px;
    height: 100px;
    background: #4a90d9;
    color: #ffffff;
  }
  #fr {
    float: right;
    width: 120px;
    height: 160px;
    background: #4ab06a;
    color: #ffffff;
  }
  /* y = 100: clears only the short left float */
  #c-left {
    clear: left;
    height: 24px;
    background: #f0c948;
  }
  /* y = 160: hypothetical 124, pushed past the tall right float */
  #c-right {
    clear: right;
    height: 24px;
    background: #e08a3c;
  }
  /* a fresh left float begins at y = 184, bottom 244 */
  #fl2 {
    float: left;
    width: 100px;
    height: 60px;
    background: #8a5ad9;
    color: #ffffff;
  }
  /* y = 244: clears everything including the new float */
  #c-both {
    clear: both;
    height: 24px;
    background: #d94a6a;
    color: #ffffff;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="fl"><span class="w" style="width:56px"></span></div>
    <div id="fr"><span class="w" style="width:64px"></span></div>
    <div id="c-left"><span class="w" style="width:60px"></span></div>
    <div id="c-right"><span class="w" style="width:68px"></span></div>
    <div id="fl2"><span class="w" style="width:52px"></span></div>
    <div id="c-both"><span class="w" style="width:72px; background:#8a3040"></span></div>
  </div>
</body>
</html>
