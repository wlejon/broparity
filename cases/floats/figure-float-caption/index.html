<!DOCTYPE html>

<meta charset="utf-8">
<title>figure-float-caption</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #article {
    width: 560px;
    margin: 20px;
    font-size: 15px;
    line-height: 20px;
    background: #faf7f0;
  }
  #fig {
    float: right;
    width: 160px;
    margin: 0 0 12px 16px;
    background: #efe6d4;
  }
  #fig img {
    display: block;
    width: 160px;
    height: 100px;
  }
  #cap {
    margin: 0;
    padding: 4px 6px;
    font-size: 12px;
    line-height: 16px;
    color: #6a5f4a;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #a88860; }
  /* caption words: smaller to match the 12px/16px caption type scale */
  .cw { display: inline-block; height: 10px; vertical-align: top; background: #6a5f4a; }
</style>
