<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>float-right-text-wrap</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #para {
    width: 500px;
    margin: 20px;
    font-size: 16px;
    line-height: 20px;
    background: #f4f0e6;
  }
  #floatbox {
    float: right;
    width: 120px;
    height: 120px;
    background: #d9774a;
    color: #ffffff;
  }
  /* word-like fixed-size inline-blocks: wrap at their boundaries like
     words, without font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #a88860; }
</style>
</head>
<body>
  <div id="para">
    <div id="floatbox"><span class="w" style="width:40px; background:#7a3418"></span></div>
    <span class="w" style="width:56px"></span> <span class="w" style="width:72px"></span>
    <span class="w" style="width:40px"></span> <span class="w" style="width:88px"></span>
    <span class="w" style="width:64px"></span> <span class="w" style="width:48px"></span>
    <span class="w" style="width:96px"></span> <span class="w" style="width:36px"></span>
    <span class="w" style="width:80px"></span> <span class="w" style="width:52px"></span>
    <span class="w" style="width:68px"></span> <span class="w" style="width:44px"></span>
    <span class="w" style="width:92px"></span> <span class="w" style="width:60px"></span>
    <span class="w" style="width:76px"></span> <span class="w" style="width:32px"></span>
    <span class="w" style="width:84px"></span> <span class="w" style="width:56px"></span>
    <span class="w" style="width:48px"></span> <span class="w" style="width:100px"></span>
    <span class="w" style="width:64px"></span> <span class="w" style="width:40px"></span>
    <span class="w" style="width:72px"></span> <span class="w" style="width:88px"></span>
    <span class="w" style="width:52px"></span> <span class="w" style="width:60px"></span>
  </div>
</body>
</html>
