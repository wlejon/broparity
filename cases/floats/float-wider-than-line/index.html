<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>float-wider-than-line</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #lane {
    width: 500px;
    margin: 20px;
    overflow: hidden;
    background: #ececec;
  }
  #narrow {
    float: left;
    width: 150px;
    height: 60px;
    background: #4a90d9;
    color: #ffffff;
    font-size: 14px;
    line-height: 60px;
    text-align: center;
  }
  /* 400px does not fit beside the 150px float (550 > 500), so this
     float drops below it: expected position x = 0, y = 60. */
  #wide {
    float: left;
    width: 400px;
    height: 60px;
    background: #d94a6a;
    color: #ffffff;
    font-size: 14px;
    line-height: 60px;
    text-align: center;
  }
  /* 80px fits in the 100px left beside #wide: x = 400, y = 60. */
  #small {
    float: left;
    width: 80px;
    height: 60px;
    background: #4ab06a;
    color: #ffffff;
    font-size: 14px;
    line-height: 60px;
    text-align: center;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div id="lane">
    <div id="narrow"><span class="w" style="width:48px"></span></div>
    <div id="wide"><span class="w" style="width:96px; background:#8a3040"></span></div>
    <div id="small"><span class="w" style="width:36px; background:#2a5a3a"></span></div>
  </div>
</body>
</html>
