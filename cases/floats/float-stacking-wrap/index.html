<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>float-stacking-wrap</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  /* 500px lane: three 150px floats fit on the first float line
     (x = 0, 150, 300); the fourth wraps to y = 60 at x = 0 and the
     fifth follows it at x = 150. */
  #lane {
    width: 500px;
    margin: 20px;
    overflow: hidden;
    background: #ececec;
  }
  #lane > div {
    float: left;
    width: 150px;
    height: 60px;
    color: #ffffff;
    font-size: 14px;
    line-height: 60px;
    text-align: center;
  }
  #f1 { background: #4a90d9; }
  #f2 { background: #4ab06a; }
  #f3 { background: #f0a030; }
  #f4 { background: #8a5ad9; }
  #f5 { background: #d94a6a; }
</style>
</head>
<body>
  <div id="lane">
    <div id="f1">1</div>
    <div id="f2">2</div>
    <div id="f3">3</div>
    <div id="f4">4</div>
    <div id="f5">5</div>
  </div>
</body>
</html>
