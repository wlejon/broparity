<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>float-margins-offset</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #lane {
    width: 600px;
    margin: 20px;
    overflow: hidden;
    background: #ececec;
  }
  #lane > .f {
    float: left;
    width: 100px;
    height: 80px;
    margin: 20px;
    color: #ffffff;
    font-size: 14px;
    line-height: 80px;
    text-align: center;
  }
  /* Float margins never collapse. m1 border box at (20,20); m2 border
     box at (160,20) — the two 20px margins between them BOTH count
     (100 + 20 + 20 + 20 = 160), not 140. */
  #m1 { background: #4a90d9; }
  #m2 { background: #4ab06a; }
  /* Clearance clears the float's bottom MARGIN edge (20+80+20 = 120),
     and the float's 20px bottom margin does not collapse with this
     block either: y = 120. */
  #cleared {
    clear: left;
    height: 24px;
    background: #d94a6a;
    color: #ffffff;
    font-size: 14px;
    line-height: 24px;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div id="lane">
    <div class="f" id="m1"><span class="w" style="width:36px"></span></div>
    <div class="f" id="m2"><span class="w" style="width:36px"></span></div>
    <div id="cleared"><span class="w" style="width:92px; background:#8a3040"></span></div>
  </div>
</body>
</html>
