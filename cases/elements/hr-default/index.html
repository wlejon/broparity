<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hr-default</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  body > div { width: 500px; background: #e2e8f0; }
  #h2 { width: 50%; }
  #h3 { border: 3px solid #c0504d; }
</style>
</head>
<body>
<div id="a">Block above the bare hr</div>
<hr id="h1">
<div id="b">Between bare and half-width</div>
<hr id="h2">
<div id="c">Between half-width and styled</div>
<hr id="h3">
<div id="d">Block below the styled hr</div>
</body>
</html>
