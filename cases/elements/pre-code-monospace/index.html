<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pre-code-monospace</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  body { width: 600px; }
  code, kbd, samp { background: #e6e0f5; }
  pre { background: #e2e8f0; }
  #pre2, #cd2 { font-family: monospace, monospace; }
  p { background: #f7f2e2; }
</style>
</head>
<body>
<p id="para1">Sans 16px flow with <code id="cd1">inline_code()</code> then <kbd id="kb1">Ctrl+K</kbd> then <samp id="sm1">sample out</samp> inline.</p>
<pre id="pre1">pre with plain monospace
second preformatted line</pre>
<pre id="pre2">pre with monospace, monospace
second preformatted line</pre>
<p id="para2">Double-mono inline <code id="cd2">code keeps 16px</code> in this line.</p>
</body>
</html>
