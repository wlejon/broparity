<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>address-small-strong</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  body { width: 600px; }
  address { background: #eef2e0; }
  p { background: #f7f2e2; }
  small { background: #cfe8ff; }
  strong, b { background: #ffe6c2; }
  em, i { background: #d8ecd8; }
  u { background: #e6e0f5; }
  s { background: #f5d8d8; }
</style>
</head>
<body>
<address id="addr">Address element rendered in italic block flow</address>
<p id="mix1">Normal then <small id="sm">small text at smaller size</small> then <strong id="st">strong text</strong> and <b id="bb">bold b</b> end.</p>
<p id="mix2">Then <em id="em">emphasis</em> and <i id="it">italic i</i> and <u id="un">underlined</u> and <s id="str">struck out</s> end.</p>
</body>
</html>
