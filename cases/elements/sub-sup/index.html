<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>sub-sup</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  p { width: 500px; background: #f7f2e2; }
  sub { background: #cfe8ff; }
  sup { background: #f5d8d8; }
</style>
</head>
<body>
<p id="ctrl">Control line of plain text with no shifts at all</p>
<p id="mix">Water is H<sub id="sb">2</sub>O and area grows with r<sup id="sp">2</sup> in the same line</p>
<p id="tail">Tail line whose position shows any line box growth</p>
</body>
</html>
