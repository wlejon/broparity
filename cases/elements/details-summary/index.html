<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>details-summary</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  details { width: 400px; background: #eef2e0; }
  summary { background: #cfe8ff; }
  #c1, #c2 { height: 60px; background: #ffe2b8; }
  #after { width: 400px; background: #e6e0f5; }
</style>
</head>
<body>
<details id="d1">
  <summary id="s1">Closed disclosure</summary>
  <div id="c1">Hidden content that must not take height</div>
</details>
<details id="d2" open>
  <summary id="s2">Open disclosure</summary>
  <div id="c2">Visible content block sixty pixels tall</div>
</details>
<div id="after">Flow resumes here after both widgets</div>
</body>
</html>
