<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>details-summary</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  body { line-height: 20px; }
  details { width: 400px; background: #eef2e0; }
  summary { background: #cfe8ff; }
  #c1, #c2 { height: 60px; background: #ffe2b8; }
  #after { width: 400px; background: #e6e0f5; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
</style>
</head>
<body>
<details id="d1">
  <summary id="s1"><span class="w" style="width:64px"></span> <span class="w" style="width:88px"></span></summary>
  <div id="c1"><span class="w" style="width:56px"></span> <span class="w" style="width:40px"></span> <span class="w" style="width:72px"></span></div>
</details>
<details id="d2" open>
  <summary id="s2"><span class="w" style="width:48px"></span> <span class="w" style="width:92px"></span></summary>
  <div id="c2"><span class="w" style="width:60px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:80px"></span></div>
</details>
<div id="after"><span class="w" style="width:44px"></span> <span class="w" style="width:68px"></span> <span class="w" style="width:52px"></span></div>
</body>
</html>
