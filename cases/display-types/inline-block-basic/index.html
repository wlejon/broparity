<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>inline-block-basic</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #row { margin: 20px; }
  .ib {
    display: inline-block;
    width: 120px;
    height: 60px;
    margin-right: 10px;
    padding: 8px;
    border: 2px solid #404040;
    background: #f0f0ff;
    box-sizing: content-box;
    line-height: 20px;
  }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
</style>
</head>
<body>
  <div id="row">
    <div class="ib"><span class="w" style="width:48px"></span> <span class="w" style="width:36px"></span></div>
    <div class="ib"><span class="w" style="width:64px"></span> <span class="w" style="width:32px"></span></div>
    <div class="ib"><span class="w" style="width:56px"></span> <span class="w" style="width:40px"></span></div>
  </div>
</body>
</html>
