<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>inline-block-basic</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #row { margin: 20px; }
  .ib {
    display: inline-block;
    width: 120px;
    height: 60px;
    margin-right: 10px;
    padding: 8px;
    border: 2px solid #404040;
    background: #f0f0ff;
    box-sizing: content-box;
  }
</style>
</head>
<body>
  <div id="row">
    <div class="ib">first</div>
    <div class="ib">second</div>
    <div class="ib">third</div>
  </div>
</body>
</html>
