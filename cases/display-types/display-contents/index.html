<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>display-contents</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .wrap { display: contents; }
  .item { width: 200px; height: 32px; margin: 6px; background: #dddddd; color: #202020; font-size: 13px; }

  /* flex container: display:contents child's children become flex items */
  .flexbox { display: flex; gap: 10px; margin: 10px; background: #f0f0f0; padding: 8px; }
  .flexbox .cell { width: 110px; height: 44px; background: #1565c0; color: #ffffff; font-size: 12px; }
  .flexbox .wrap .cell { background: #2e7d32; }

  /* block flow: children promoted, wrapper generates no box */
  .blockhost { margin: 10px; padding: 8px; background: #f0f0f0; }
</style>
</head>
<body>
  <div class="blockhost">
    <div class="item">before</div>
    <div class="wrap">
      <div class="item">promoted 1</div>
      <div class="item">promoted 2</div>
    </div>
    <div class="item">after</div>
  </div>

  <div class="flexbox">
    <div class="cell">real item</div>
    <div class="wrap">
      <div class="cell">via contents 1</div>
      <div class="cell">via contents 2</div>
    </div>
    <div class="cell">real item</div>
  </div>
</body>
</html>
