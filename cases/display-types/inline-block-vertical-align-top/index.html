<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>inline-block-vertical-align-top</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; line-height: 1.4; }
  #row { margin: 30px; background: #f8f8f0; padding: 4px; line-height: 22px; }
  .ib {
    display: inline-block;
    vertical-align: top;
    background: #e0f0ff;
    border: 1px solid #4080c0;
    padding: 4px 8px;
    margin-right: 8px;
  }
  .tall { height: 80px; width: 60px; }
  .mid { height: 40px; width: 60px; }
  .short { height: 20px; width: 60px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
</style>
</head>
<body>
  <div id="row">
    <span class="w" style="width:44px"></span> <span class="w" style="width:60px"></span>
    <span class="ib tall"><span class="w" style="width:36px"></span></span>
    <span class="ib mid"><span class="w" style="width:32px"></span></span>
    <span class="ib short"><span class="w" style="width:40px"></span></span>
    <span class="w" style="width:52px"></span> <span class="w" style="width:36px"></span>
  </div>
</body>
</html>
