<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>inline-vs-inline-block</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; line-height: 1.5; }
  #p { margin: 30px; width: 500px; background: #f8f8f0; }
  .inl { background: #ffe0e0; }
  .ib { display: inline-block; width: 80px; height: 30px; background: #e0e0ff; border: 1px solid #4080c0; }
</style>
</head>
<body>
  <p id="p">Plain leading text <span class="inl">inline span</span> mid text <span class="ib">ib1</span> more text <span class="inl">inline two</span> tail <span class="ib">ib2</span> end.</p>
</body>
</html>
