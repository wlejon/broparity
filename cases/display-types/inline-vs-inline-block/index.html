<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>inline-vs-inline-block</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; line-height: 1.5; }
  #p { margin: 30px; width: 500px; background: #f8f8f0; }
  .inl { background: #ffe0e0; }
  .ib { display: inline-block; width: 80px; height: 30px; background: #e0e0ff; border: 1px solid #4080c0; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
</style>
</head>
<body>
<p id="p"><span class="w" style="width:56px"></span> <span class="w" style="width:72px"></span> <span class="w" style="width:40px"></span> <span class="inl"><span class="w" style="width:96px; vertical-align: baseline"></span></span> <span class="w" style="width:36px"></span> <span class="w" style="width:48px"></span> <span class="ib"></span> <span class="w" style="width:52px"></span> <span class="w" style="width:64px"></span> <span class="inl"><span class="w" style="width:84px; vertical-align: baseline"></span></span> <span class="w" style="width:44px"></span> <span class="ib"></span> <span class="w" style="width:36px"></span></p>
</body>
</html>
