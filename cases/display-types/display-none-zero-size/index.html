<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>display-none-zero-size</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #wrap { margin: 30px; }
  #before, #after { width: 200px; height: 40px; background: #e0f0ff; border: 1px solid #4080c0; }
  #hidden { display: none; width: 200px; height: 40px; background: #ffe0e0; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="before">before</div>
    <div id="hidden">hidden</div>
    <div id="after">after</div>
  </div>
</body>
</html>
