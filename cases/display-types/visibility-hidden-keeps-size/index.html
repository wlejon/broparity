<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>visibility-hidden-keeps-size</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #wrap { margin: 30px; }
  #before, #after { width: 200px; height: 40px; background: #e0f0ff; border: 1px solid #4080c0; }
  #hidden { visibility: hidden; width: 200px; height: 40px; background: #ffe0e0; }
  #wrap { line-height: 20px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="before"><span class="w" style="width:56px"></span> <span class="w" style="width:36px"></span></div>
    <div id="hidden"><span class="w" style="width:64px"></span> <span class="w" style="width:44px"></span></div>
    <div id="after"><span class="w" style="width:48px"></span> <span class="w" style="width:72px"></span></div>
  </div>
</body>
</html>
