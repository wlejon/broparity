<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>signup-split</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; }
  .page { width: 800px; height: 600px; overflow: hidden; display: flex; }
  .brand-side { width: 320px; background: linear-gradient(160deg, #1e3a8a, #2563eb 60%, #06b6d4); padding: 44px 36px; position: relative; }
  .logo { width: 120px; height: 26px; background: rgba(255,255,255,0.95); border-radius: 6px; }
  .pitch { position: absolute; bottom: 120px; left: 36px; right: 36px; }
  .p-title { height: 20px; background: rgba(255,255,255,0.95); border-radius: 5px; margin-bottom: 10px; }
  .p-title.l1 { width: 80%; }
  .p-title.l2 { width: 55%; }
  .p-sub { height: 10px; background: rgba(255,255,255,0.55); border-radius: 5px; margin-bottom: 8px; }
  .p-sub.w { width: 70%; }
  .dots { position: absolute; bottom: 44px; left: 36px; display: flex; gap: 8px; }
  .d { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.35); }
  .d.on { background: #fff; }
  .form-side { flex: 1; padding: 44px 48px; display: flex; flex-direction: column; justify-content: center; }
  .title { width: 180px; height: 22px; background: #16203a; border-radius: 5px; margin-bottom: 6px; }
  .sub { width: 240px; height: 10px; background: #c2c8d4; border-radius: 5px; margin-bottom: 28px; }
  .row2 { display: flex; gap: 14px; }
  .field { margin-bottom: 16px; flex: 1; }
  .lbl { width: 60px; height: 9px; background: #aeb4c0; border-radius: 4px; margin-bottom: 7px; }
  .input { width: 100%; height: 42px; background: #f5f7fa; border: 1px solid #e2e6ee; border-radius: 9px; box-sizing: border-box; }
  .terms { display: flex; align-items: center; gap: 9px; margin: 4px 0 20px; }
  .box { width: 16px; height: 16px; border: 1px solid #c4c9d4; border-radius: 4px; }
  .t-lbl { width: 180px; height: 8px; background: #c4c9d4; border-radius: 4px; }
  .submit { width: 100%; height: 48px; background: #2563eb; border-radius: 9px; box-shadow: 0 8px 18px rgba(37,99,235,0.3); }
</style>
</head>
<body>
<div class="page">
  <div class="brand-side">
    <div class="logo"></div>
    <div class="pitch">
      <div class="p-title l1"></div>
      <div class="p-title l2"></div>
      <div class="p-sub"></div>
      <div class="p-sub w"></div>
    </div>
    <div class="dots"><div class="d on"></div><div class="d"></div><div class="d"></div></div>
  </div>
  <div class="form-side">
    <div class="title"></div>
    <div class="sub"></div>
    <div class="row2">
      <div class="field"><div class="lbl"></div><div class="input"></div></div>
      <div class="field"><div class="lbl"></div><div class="input"></div></div>
    </div>
    <div class="field"><div class="lbl"></div><div class="input"></div></div>
    <div class="field"><div class="lbl"></div><div class="input"></div></div>
    <div class="terms"><div class="box"></div><div class="t-lbl"></div></div>
    <div class="submit"></div>
  </div>
</div>
</body>
</html>
