<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>login-centered</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; }
  .page { width: 800px; height: 600px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea, #764ba2); }
  .card { width: 360px; background: #fff; border-radius: 16px; padding: 36px 34px; box-shadow: 0 24px 60px rgba(0,0,0,0.25); }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #667eea, #764ba2); margin: 0 auto 22px; }
  .title { width: 160px; height: 20px; background: #1c2333; border-radius: 5px; margin: 0 auto 8px; }
  .sub { width: 220px; height: 10px; background: #c4c9d4; border-radius: 5px; margin: 0 auto 28px; }
  .field { margin-bottom: 16px; }
  .lbl { width: 70px; height: 9px; background: #aeb4c0; border-radius: 4px; margin-bottom: 8px; }
  .input { width: 100%; height: 44px; background: #f4f6fa; border: 1px solid #e3e7ee; border-radius: 10px; box-sizing: border-box; }
  .row { display: flex; align-items: center; margin: 6px 0 22px; }
  .remember { display: flex; align-items: center; gap: 8px; }
  .box { width: 16px; height: 16px; border: 1px solid #c4c9d4; border-radius: 4px; }
  .r-lbl { width: 70px; height: 8px; background: #c4c9d4; border-radius: 4px; }
  .forgot { margin-left: auto; width: 80px; height: 8px; background: #667eea; border-radius: 4px; }
  .submit { width: 100%; height: 48px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; box-shadow: 0 8px 18px rgba(102,126,234,0.35); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
  .divider .ln { flex: 1; height: 1px; background: #e3e7ee; }
  .divider .dot { width: 30px; height: 8px; background: #d4d9e2; border-radius: 4px; }
  .social { display: flex; gap: 12px; }
  .soc { flex: 1; height: 44px; border: 1px solid #e3e7ee; border-radius: 10px; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="logo"></div>
    <div class="title"></div>
    <div class="sub"></div>
    <div class="field"><div class="lbl"></div><div class="input"></div></div>
    <div class="field"><div class="lbl"></div><div class="input"></div></div>
    <div class="row">
      <div class="remember"><div class="box"></div><div class="r-lbl"></div></div>
      <div class="forgot"></div>
    </div>
    <div class="submit"></div>
    <div class="divider"><div class="ln"></div><div class="dot"></div><div class="ln"></div></div>
    <div class="social"><div class="soc"></div><div class="soc"></div></div>
  </div>
</div>
</body>
</html>
