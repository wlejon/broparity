<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>topnav-table</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #f6f8fa; }
  .page { width: 800px; height: 600px; overflow: hidden; }
  .topnav { height: 58px; padding: 0 24px; display: flex; align-items: center; gap: 28px; background: #fff; border-bottom: 1px solid #e6e9ee; }
  .brand { width: 100px; height: 22px; background: #0f62fe; border-radius: 5px; }
  .tab { width: 60px; height: 12px; background: #c7ccd6; border-radius: 6px; }
  .tab.active { background: #0f62fe; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .bell { width: 30px; height: 30px; border-radius: 8px; background: #eef1f6; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #0f62fe, #00c2ff); }
  .content { padding: 22px 24px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi { background: #fff; border: 1px solid #e6e9ee; border-radius: 10px; padding: 16px; }
  .kpi-lbl { width: 70px; height: 10px; background: #b9c0cc; border-radius: 5px; margin-bottom: 12px; }
  .kpi-num { width: 100px; height: 22px; background: #1a2433; border-radius: 5px; margin-bottom: 10px; }
  .kpi-trend { width: 54px; height: 18px; border-radius: 9px; }
  .kpi:nth-child(1) .kpi-trend { background: #d6f5e3; }
  .kpi:nth-child(2) .kpi-trend { background: #d6f5e3; }
  .kpi:nth-child(3) .kpi-trend { background: #fde0e0; }
  .table { background: #fff; border: 1px solid #e6e9ee; border-radius: 10px; overflow: hidden; }
  .t-head { display: flex; padding: 14px 18px; background: #f1f3f7; border-bottom: 1px solid #e6e9ee; }
  .t-row { display: flex; align-items: center; padding: 13px 18px; border-bottom: 1px solid #eef1f5; }
  .t-row:last-child { border-bottom: none; }
  .col-name { flex: 3; display: flex; align-items: center; gap: 10px; }
  .col { flex: 2; }
  .col-status { flex: 1; }
  .r-avatar { width: 28px; height: 28px; border-radius: 50%; background: #d4dae4; }
  .hc { height: 9px; background: #aab2c0; border-radius: 4px; width: 60%; }
  .cell { height: 9px; background: #d6dbe4; border-radius: 4px; width: 70%; }
  .pill { width: 56px; height: 20px; border-radius: 10px; }
  .t-row:nth-child(odd) .pill { background: #d6f5e3; }
  .t-row:nth-child(even) .pill { background: #fff0d6; }
</style>
</head>
<body>
<div class="page">
  <div class="topnav">
    <div class="brand"></div>
    <div class="tab active"></div>
    <div class="tab"></div>
    <div class="tab"></div>
    <div class="top-right"><div class="bell"></div><div class="avatar"></div></div>
  </div>
  <div class="content">
    <div class="kpis">
      <div class="kpi"><div class="kpi-lbl"></div><div class="kpi-num"></div><div class="kpi-trend"></div></div>
      <div class="kpi"><div class="kpi-lbl"></div><div class="kpi-num"></div><div class="kpi-trend"></div></div>
      <div class="kpi"><div class="kpi-lbl"></div><div class="kpi-num"></div><div class="kpi-trend"></div></div>
    </div>
    <div class="table">
      <div class="t-head"><div class="col-name"><div class="hc"></div></div><div class="col"><div class="hc"></div></div><div class="col"><div class="hc"></div></div><div class="col-status"><div class="hc"></div></div></div>
      <div class="t-row"><div class="col-name"><div class="r-avatar"></div><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col-status"><div class="pill"></div></div></div>
      <div class="t-row"><div class="col-name"><div class="r-avatar"></div><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col-status"><div class="pill"></div></div></div>
      <div class="t-row"><div class="col-name"><div class="r-avatar"></div><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col-status"><div class="pill"></div></div></div>
      <div class="t-row"><div class="col-name"><div class="r-avatar"></div><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col-status"><div class="pill"></div></div></div>
      <div class="t-row"><div class="col-name"><div class="r-avatar"></div><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col"><div class="cell"></div></div><div class="col-status"><div class="pill"></div></div></div>
    </div>
  </div>
</div>
</body>
</html>
