<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>relative-offset</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #shadow {
    width: 200px;
    height: 100px;
    margin: 50px;
    background: #dddddd;
  }
  #moved {
    position: relative;
    top: 20px;
    left: 30px;
    width: 200px;
    height: 100px;
    margin: 50px;
    background: #c0d0e0;
  }
</style>
</head>
<body>
  <div id="shadow">static</div>
  <div id="moved">relative</div>
</body>
</html>
