<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>absolute-percent</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #parent {
    position: relative;
    width: 400px;
    height: 300px;
    margin: 50px;
    background: #eeeeee;
  }
  #child {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 80px;
    background: #c0d0e0;
  }
</style>
</head>
<body>
  <div id="parent">
    <div id="child">50%</div>
  </div>
</body>
</html>
