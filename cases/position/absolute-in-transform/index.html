<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>absolute-in-transform</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 300px; margin: 20px; background: #eeeeee; transform: translate(0, 0); }
   #b { position: absolute; left: 50px; top: 50px; width: 100px; height: 100px; background: #c00000; }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
