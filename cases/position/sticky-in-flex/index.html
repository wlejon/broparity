<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>sticky-in-flex</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #c { display: flex; width: 600px; height: 80px; margin: 20px; background: #eeeeee; }
   #c > div { width: 100px; height: 80px; background: #c0d0e0; }
   #a { background: #c00000; position: sticky; top: 0; }
   #b { background: #008000; }
   #d { background: #0000c0; }
</style>
</head>
<body>
<div id="c"><div id="a"></div><div id="b"></div><div id="d"></div></div>
</body>
</html>
