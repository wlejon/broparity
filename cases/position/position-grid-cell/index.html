<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>position-grid-cell</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #g { display: grid; grid-template-columns: 200px 200px; gap: 8px; width: 408px; height: 200px; margin: 20px; background: #eeeeee; }
   #a { background: #c0d0e0; }
   #b { position: relative; background: #d0e0c0; }
   #inner { position: absolute; left: 20px; top: 20px; width: 80px; height: 80px; background: #c00000; }
</style>
</head>
<body>
<div id="g"><div id="a"></div><div id="b"><div id="inner"></div></div></div>
</body>
</html>
