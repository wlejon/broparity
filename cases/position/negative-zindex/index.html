<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>negative-zindex</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #parent {
    position: relative;
    width: 500px;
    height: 400px;
    margin: 50px;
    background: #eeeeee;
  }
  #behind {
    position: absolute;
    top: 30px;
    left: 30px;
    width: 200px;
    height: 200px;
    background: #ff0000;
    z-index: -1;
  }
  #front {
    width: 250px;
    height: 150px;
    margin: 60px 0 0 60px;
    background: #00ff00;
  }
</style>
</head>
<body>
  <div id="parent">
    <div id="behind"></div>
    <div id="front"></div>
  </div>
</body>
</html>
