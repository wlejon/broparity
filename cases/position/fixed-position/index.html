<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fixed-position</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #flow {
    width: 400px;
    height: 200px;
    margin: 50px;
    background: #eeeeee;
  }
  #fixed {
    position: fixed;
    top: 0;
    left: 0;
    width: 200px;
    height: 80px;
    background: #c0d0e0;
  }
</style>
</head>
<body>
  <div id="flow">flow</div>
  <div id="fixed">fixed</div>
</body>
</html>
