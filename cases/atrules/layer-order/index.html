<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>layer-order</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .box { width: 240px; height: 40px; margin: 10px; background: #dddddd; color: #202020; line-height: 20px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }

  @layer base, theme;

  /* later layer beats earlier layer regardless of order in file */
  @layer theme {
    #a { background: #2e7d32; color: #ffffff; }
  }
  @layer base {
    #a { background: #c62828; }
    #b { background: #c62828; }
  }

  /* unlayered beats layered at same importance */
  #b { background: #1565c0; color: #ffffff; width: 320px; }

  /* !important reverses layer priority: EARLIER layer's !important wins
     over later layer's !important and over unlayered normal. */
  @layer base {
    #c { background: #6a1b9a !important; color: #ffffff; }
  }
  @layer theme {
    #c { background: #c62828 !important; }
  }
  #c { background: #dddddd; }
</style>
</head>
<body>
  <div class="box" id="a"><span class="w" style="width:40px"></span> <span class="w" style="width:44px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:52px"></span></div>
  <div class="box" id="b"><span class="w" style="width:76px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:44px"></span> <span class="w" style="width:36px"></span></div>
  <div class="box" id="c"><span class="w" style="width:52px"></span> <span class="w" style="width:80px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:56px"></span></div>
</body>
</html>
