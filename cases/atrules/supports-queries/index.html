<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>supports-queries</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .box { width: 240px; height: 40px; margin: 10px; background: #dddddd; color: #202020; line-height: 20px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }

  @supports (display: grid) {
    #grid-yes { background: #2e7d32; color: #ffffff; }
  }
  @supports (display: fake-value-nobody-supports) {
    #grid-yes { background: #c62828; height: 80px; }
  }
  @supports not (display: fake-value-nobody-supports) {
    #not-fake { background: #1565c0; color: #ffffff; width: 320px; }
  }
  @supports (display: flex) and (position: absolute) {
    #and-both { background: #6a1b9a; color: #ffffff; }
  }
  @supports (display: fake-value-nobody-supports) or (color: red) {
    #or-one { background: #ef6c00; color: #ffffff; width: 300px; }
  }
</style>
</head>
<body>
  <div class="box" id="grid-yes"><span class="w" style="width:64px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:48px"></span></div>
  <div class="box" id="not-fake"><span class="w" style="width:32px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:40px"></span> <span class="w" style="width:36px"></span></div>
  <div class="box" id="and-both"><span class="w" style="width:36px"></span> <span class="w" style="width:32px"></span> <span class="w" style="width:56px"></span></div>
  <div class="box" id="or-one"><span class="w" style="width:36px"></span> <span class="w" style="width:32px"></span> <span class="w" style="width:44px"></span> <span class="w" style="width:52px"></span></div>
</body>
</html>
