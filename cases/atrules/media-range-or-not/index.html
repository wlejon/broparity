<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>media-range-or-not</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .box { width: 240px; height: 40px; margin: 10px; background: #dddddd; color: #202020; line-height: 20px; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }

  /* range syntax — viewport 800x600 matches */
  @media (600px <= width <= 1000px) {
    #range { background: #2e7d32; color: #ffffff; }
  }
  @media (width >= 900px) {
    #range { background: #c62828; height: 80px; }
  }
  /* orientation */
  @media (orientation: landscape) {
    #orient { background: #1565c0; color: #ffffff; width: 320px; }
  }
  @media (orientation: portrait) {
    #orient { background: #c62828; height: 80px; }
  }
  /* comma = OR: second branch matches */
  @media (max-width: 300px), (min-width: 700px) {
    #or { background: #6a1b9a; color: #ffffff; }
  }
  /* not: inner query matches, so not(...) must NOT apply */
  @media not all and (min-width: 600px) {
    #not { background: #c62828; height: 80px; }
  }
</style>
</head>
<body>
  <div class="box" id="range"><span class="w" style="width:44px"></span> <span class="w" style="width:72px"></span> <span class="w" style="width:48px"></span></div>
  <div class="box" id="orient"><span class="w" style="width:76px"></span> <span class="w" style="width:40px"></span> <span class="w" style="width:36px"></span></div>
  <div class="box" id="or"><span class="w" style="width:48px"></span> <span class="w" style="width:56px"></span></div>
  <div class="box" id="not"><span class="w" style="width:64px"></span> <span class="w" style="width:40px"></span> <span class="w" style="width:44px"></span></div>
</body>
</html>
