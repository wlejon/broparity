<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>wrapping-text-cells</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    width: 500px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
    table-layout: fixed;
  }
  td {
    padding: 8px 10px;
    border: 1px solid #808080;
    background: #ffffff;
    vertical-align: top;
    word-wrap: break-word;
  }
  td.a { width: 120px; background: #ffe8e8; }
  td.b { width: 180px; background: #e8ffe8; }
  td.c { width: 200px; background: #e8e8ff; }
  /* word-like fixed-size inline-blocks: they soft-wrap exactly like word
     runs but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .w3 { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="a"><span class="w" style="width:48px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:52px"></span> <span class="w" style="width:32px"></span> <span class="w" style="width:56px"></span> <span class="w" style="width:28px"></span> <span class="w" style="width:44px"></span></td>
      <td class="b"><span class="w w2" style="width:64px"></span> <span class="w w2" style="width:48px"></span> <span class="w w2" style="width:32px"></span> <span class="w w2" style="width:56px"></span> <span class="w w2" style="width:60px"></span> <span class="w w2" style="width:72px"></span> <span class="w w2" style="width:40px"></span> <span class="w w2" style="width:32px"></span> <span class="w w2" style="width:52px"></span></td>
      <td class="c"><span class="w w3" style="width:60px"></span> <span class="w w3" style="width:56px"></span> <span class="w w3" style="width:44px"></span> <span class="w w3" style="width:68px"></span> <span class="w w3" style="width:40px"></span> <span class="w w3" style="width:52px"></span> <span class="w w3" style="width:76px"></span> <span class="w w3" style="width:36px"></span> <span class="w w3" style="width:48px"></span> <span class="w w3" style="width:64px"></span> <span class="w w3" style="width:44px"></span></td>
    </tr>
  </table>
</body>
</html>
