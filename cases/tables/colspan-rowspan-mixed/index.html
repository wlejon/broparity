<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>colspan-rowspan-mixed</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    width: 100px;
    height: 60px;
    padding: 6px 10px;
    border: 1px solid #808080;
    background: #ffffff;
    text-align: center;
  }
  td.span { background: #d0e0ff; font-weight: bold; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="span" colspan="2" rowspan="2">2x2</td>
      <td>r1c3</td>
      <td>r1c4</td>
    </tr>
    <tr>
      <td>r2c3</td>
      <td>r2c4</td>
    </tr>
    <tr>
      <td>r3c1</td>
      <td>r3c2</td>
      <td class="span" colspan="2">2cols</td>
    </tr>
    <tr>
      <td>r4c1</td>
      <td class="span" rowspan="2">2rows</td>
      <td>r4c3</td>
      <td>r4c4</td>
    </tr>
    <tr>
      <td>r5c1</td>
      <td>r5c3</td>
      <td>r5c4</td>
    </tr>
  </table>
</body>
</html>
