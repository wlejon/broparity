<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>colspan-rowspan-mixed</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    width: 100px;
    height: 60px;
    padding: 6px 10px;
    border: 1px solid #808080;
    background: #ffffff;
    text-align: center;
  }
  td.span { background: #d0e0ff; font-weight: bold; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .ws { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="span" colspan="2" rowspan="2"><span class="w ws" style="width:36px"></span></td>
      <td><span class="w" style="width:40px"></span></td>
      <td><span class="w" style="width:44px"></span></td>
    </tr>
    <tr>
      <td><span class="w" style="width:36px"></span></td>
      <td><span class="w" style="width:48px"></span></td>
    </tr>
    <tr>
      <td><span class="w w2" style="width:40px"></span></td>
      <td><span class="w w2" style="width:36px"></span></td>
      <td class="span" colspan="2"><span class="w ws" style="width:44px"></span></td>
    </tr>
    <tr>
      <td><span class="w w2" style="width:44px"></span></td>
      <td class="span" rowspan="2"><span class="w ws" style="width:40px"></span></td>
      <td><span class="w w2" style="width:36px"></span></td>
      <td><span class="w w2" style="width:48px"></span></td>
    </tr>
    <tr>
      <td><span class="w w2" style="width:40px"></span></td>
      <td><span class="w w2" style="width:44px"></span></td>
      <td><span class="w w2" style="width:36px"></span></td>
    </tr>
  </table>
</body>
</html>
