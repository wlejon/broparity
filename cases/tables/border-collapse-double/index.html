<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>border-collapse-double</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border-collapse: collapse;
    border: 6px double #404040;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    padding: 10px 14px;
    border: 6px double #808080;
    background: #ffffff;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .w3 { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <tr><td><span class="w" style="width:28px"></span></td><td><span class="w" style="width:32px"></span></td><td><span class="w" style="width:24px"></span></td></tr>
    <tr><td><span class="w w2" style="width:32px"></span></td><td><span class="w w2" style="width:24px"></span></td><td><span class="w w2" style="width:28px"></span></td></tr>
    <tr><td><span class="w w3" style="width:24px"></span></td><td><span class="w w3" style="width:28px"></span></td><td><span class="w w3" style="width:32px"></span></td></tr>
  </table>
</body>
</html>
