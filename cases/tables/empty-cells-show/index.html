<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>empty-cells-show</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .lbl { margin: 10px 20px 4px; font-size: 14px; color: #404040; }
  table {
    margin: 0 20px 20px;
    border: 2px solid #404040;
    border-spacing: 4px;
    font-size: 16px;
    color: #202020;
  }
  td {
    width: 80px;
    height: 40px;
    padding: 6px 8px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  table.show { empty-cells: show; }
  table.hide { empty-cells: hide; }
</style>
</head>
<body>
  <p class="lbl">empty-cells: show</p>
  <table class="show">
    <tr><td>a</td><td></td><td>c</td></tr>
    <tr><td></td><td>e</td><td></td></tr>
  </table>
  <p class="lbl">empty-cells: hide</p>
  <table class="hide">
    <tr><td>a</td><td></td><td>c</td></tr>
    <tr><td></td><td>e</td><td></td></tr>
  </table>
</body>
</html>
