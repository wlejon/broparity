<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>td-width-percent</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    width: 700px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
  }
  .c1 { width: 25%; background: #ffe0e0; }
  .c2 { width: 50%; background: #e0ffe0; }
  .c3 { width: 25%; background: #e0e0ff; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="c1">25%</td>
      <td class="c2">50%</td>
      <td class="c3">25%</td>
    </tr>
    <tr>
      <td>a</td>
      <td>b</td>
      <td>c</td>
    </tr>
  </table>
</body>
</html>
