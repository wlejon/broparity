<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>nested-table</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 14px;
    line-height: 18px;
    color: #202020;
  }
  td {
    padding: 8px 10px;
    border: 1px solid #808080;
    background: #ffffff;
    vertical-align: top;
  }
  table.inner {
    margin: 0;
    border: 2px solid #c04040;
    background: #fff0f0;
  }
  table.inner td {
    padding: 4px 6px;
    border: 1px solid #c08080;
    background: #ffffff;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .wi { height: 12px; background: #3060c8; }
</style>
</head>
<body>
  <table>
    <tr>
      <td><span class="w" style="width:44px"></span> <span class="w" style="width:16px"></span></td>
      <td>
        <table class="inner">
          <tr><td><span class="w wi" style="width:20px"></span></td><td><span class="w wi" style="width:24px"></span></td></tr>
          <tr><td><span class="w wi" style="width:28px"></span></td><td><span class="w wi" style="width:20px"></span></td></tr>
        </table>
      </td>
      <td><span class="w" style="width:44px"></span> <span class="w" style="width:16px"></span></td>
    </tr>
    <tr>
      <td><span class="w w2" style="width:36px"></span></td>
      <td><span class="w w2" style="width:40px"></span></td>
      <td><span class="w w2" style="width:32px"></span></td>
    </tr>
  </table>
</body>
</html>
