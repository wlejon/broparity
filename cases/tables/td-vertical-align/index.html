<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>td-vertical-align</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    width: 160px;
    height: 120px;
    padding: 6px;
    border: 1px solid #808080;
    background: #f8f8f8;
  }
  td.t { vertical-align: top; background: #ffe0e0; }
  td.m { vertical-align: middle; background: #e0ffe0; }
  td.b { vertical-align: bottom; background: #e0e0ff; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="t">top text</td>
      <td class="m">middle text</td>
      <td class="b">bottom text</td>
    </tr>
  </table>
</body>
</html>
