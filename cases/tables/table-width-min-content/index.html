<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-width-min-content</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    background: #f0f0f0;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
</style>
</head>
<body>
  <table>
    <tr><td>short</td><td>a bit longer cell text</td><td>x</td></tr>
    <tr><td>1</td><td>2</td><td>3</td></tr>
  </table>
</body>
</html>
