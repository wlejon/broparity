<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-width-min-content</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    background: #f0f0f0;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift. min-content = widest block,
     max-content = full unwrapped run, driving intrinsic table sizing */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
</style>
</head>
<body>
  <table>
    <tr>
      <td><span class="w" style="width:44px"></span></td>
      <td><span class="w" style="width:36px"></span> <span class="w" style="width:48px"></span> <span class="w" style="width:28px"></span> <span class="w" style="width:56px"></span></td>
      <td><span class="w" style="width:16px"></span></td>
    </tr>
    <tr>
      <td><span class="w w2" style="width:16px"></span></td>
      <td><span class="w w2" style="width:20px"></span></td>
      <td><span class="w w2" style="width:12px"></span></td>
    </tr>
  </table>
</body>
</html>
