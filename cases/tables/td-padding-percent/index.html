<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>td-padding-percent</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    width: 600px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    padding: 4% 6%;
    border: 1px solid #808080;
    background: #ffffff;
  }
  td.a { background: #ffe0e0; }
  td.b { background: #e0ffe0; }
  td.c { background: #e0e0ff; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
</style>
</head>
<body>
  <table>
    <tr><td class="a"><span class="w" style="width:16px"></span></td><td class="b"><span class="w" style="width:16px"></span></td><td class="c"><span class="w" style="width:16px"></span></td></tr>
    <tr><td><span class="w w2" style="width:12px"></span></td><td><span class="w w2" style="width:12px"></span></td><td><span class="w w2" style="width:12px"></span></td></tr>
  </table>
</body>
</html>
