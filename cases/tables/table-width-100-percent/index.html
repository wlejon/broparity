<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-width-100-percent</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .wrap { padding: 20px; }
  table {
    width: 100%;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  td.a { background: #ffe0e0; }
  td.b { background: #e0ffe0; }
  td.c { background: #e0e0ff; }
</style>
</head>
<body>
  <div class="wrap">
    <table>
      <tr><td class="a">A</td><td class="b">B</td><td class="c">C</td></tr>
      <tr><td>1</td><td>2</td><td>3</td></tr>
    </table>
  </div>
</body>
</html>
