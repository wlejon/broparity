<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>nth-child-row-striping</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    padding: 8px 14px;
    border: 1px solid #808080;
  }
  tr:nth-child(odd)  td { background: #ffffff; }
  tr:nth-child(even) td { background: #e8eef8; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
</style>
</head>
<body>
  <table>
    <tr><td><span class="w" style="width:44px"></span></td><td><span class="w" style="width:32px"></span></td><td><span class="w" style="width:44px"></span></td></tr>
    <tr><td><span class="w w2" style="width:48px"></span></td><td><span class="w w2" style="width:36px"></span></td><td><span class="w w2" style="width:68px"></span></td></tr>
    <tr><td><span class="w" style="width:44px"></span></td><td><span class="w" style="width:32px"></span></td><td><span class="w" style="width:44px"></span></td></tr>
    <tr><td><span class="w w2" style="width:48px"></span></td><td><span class="w w2" style="width:36px"></span></td><td><span class="w w2" style="width:68px"></span></td></tr>
    <tr><td><span class="w" style="width:44px"></span></td><td><span class="w" style="width:32px"></span></td><td><span class="w" style="width:44px"></span></td></tr>
    <tr><td><span class="w w2" style="width:48px"></span></td><td><span class="w w2" style="width:36px"></span></td><td><span class="w w2" style="width:68px"></span></td></tr>
  </table>
</body>
</html>
