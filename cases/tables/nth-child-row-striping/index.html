<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>nth-child-row-striping</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 14px;
    border: 1px solid #808080;
  }
  tr:nth-child(odd)  td { background: #ffffff; }
  tr:nth-child(even) td { background: #e8eef8; }
</style>
</head>
<body>
  <table>
    <tr><td>row 1</td><td>odd</td><td>white</td></tr>
    <tr><td>row 2</td><td>even</td><td>blue-gray</td></tr>
    <tr><td>row 3</td><td>odd</td><td>white</td></tr>
    <tr><td>row 4</td><td>even</td><td>blue-gray</td></tr>
    <tr><td>row 5</td><td>odd</td><td>white</td></tr>
    <tr><td>row 6</td><td>even</td><td>blue-gray</td></tr>
  </table>
</body>
</html>
