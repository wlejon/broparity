<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>border-collapse-mixed-widths</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    padding: 10px 14px;
    background: #ffffff;
  }
  td.thin { border: 1px solid #808080; }
  td.med  { border: 4px solid #c04040; }
  td.thick { border: 8px solid #4040c0; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .w3 { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="thin"><span class="w" style="width:32px"></span></td>
      <td class="med"><span class="w w2" style="width:56px"></span></td>
      <td class="thick"><span class="w w3" style="width:40px"></span></td>
    </tr>
    <tr>
      <td class="thick"><span class="w w3" style="width:40px"></span></td>
      <td class="thin"><span class="w" style="width:32px"></span></td>
      <td class="med"><span class="w w2" style="width:56px"></span></td>
    </tr>
    <tr>
      <td class="med"><span class="w w2" style="width:56px"></span></td>
      <td class="thick"><span class="w w3" style="width:40px"></span></td>
      <td class="thin"><span class="w" style="width:32px"></span></td>
    </tr>
  </table>
</body>
</html>
