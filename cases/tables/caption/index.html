<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>caption</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border-collapse: collapse;
    border: 2px solid #404040;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  caption {
    caption-side: top;
    padding: 6px;
    font-weight: bold;
    text-align: center;
    background: #e0e0e0;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .wc { background: #555555; }
</style>
</head>
<body>
  <table>
    <caption><span class="w wc" style="width:132px"></span></caption>
    <tr><td><span class="w" style="width:28px"></span></td><td><span class="w" style="width:36px"></span></td><td><span class="w" style="width:32px"></span></td></tr>
    <tr><td><span class="w w2" style="width:24px"></span></td><td><span class="w w2" style="width:32px"></span></td><td><span class="w w2" style="width:28px"></span></td></tr>
  </table>
</body>
</html>
