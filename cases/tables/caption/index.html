<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>caption</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border-collapse: collapse;
    border: 2px solid #404040;
    font-size: 16px;
    color: #202020;
  }
  caption {
    caption-side: top;
    padding: 6px;
    font-weight: bold;
    text-align: center;
    background: #e0e0e0;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
</style>
</head>
<body>
  <table>
    <caption>Quarterly results</caption>
    <tr><td>Q1</td><td>Q2</td><td>Q3</td></tr>
    <tr><td>10</td><td>20</td><td>30</td></tr>
  </table>
</body>
</html>
