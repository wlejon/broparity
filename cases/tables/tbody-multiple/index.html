<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>tbody-multiple</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
  }
  tbody.a td { background: #ffe0e0; }
  tbody.b td { background: #e0ffe0; }
  tbody.c td { background: #e0e0ff; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .w3 { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <tbody class="a">
      <tr><td><span class="w" style="width:28px"></span></td><td><span class="w" style="width:36px"></span></td><td><span class="w" style="width:32px"></span></td></tr>
      <tr><td><span class="w" style="width:32px"></span></td><td><span class="w" style="width:28px"></span></td><td><span class="w" style="width:36px"></span></td></tr>
    </tbody>
    <tbody class="b">
      <tr><td><span class="w w2" style="width:36px"></span></td><td><span class="w w2" style="width:32px"></span></td><td><span class="w w2" style="width:28px"></span></td></tr>
    </tbody>
    <tbody class="c">
      <tr><td><span class="w w3" style="width:28px"></span></td><td><span class="w w3" style="width:32px"></span></td><td><span class="w w3" style="width:36px"></span></td></tr>
      <tr><td><span class="w w3" style="width:36px"></span></td><td><span class="w w3" style="width:28px"></span></td><td><span class="w w3" style="width:32px"></span></td></tr>
    </tbody>
  </table>
</body>
</html>
