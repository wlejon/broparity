<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>tbody-multiple</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
  }
  tbody.a td { background: #ffe0e0; }
  tbody.b td { background: #e0ffe0; }
  tbody.c td { background: #e0e0ff; }
</style>
</head>
<body>
  <table>
    <tbody class="a">
      <tr><td>A1</td><td>A2</td><td>A3</td></tr>
      <tr><td>A4</td><td>A5</td><td>A6</td></tr>
    </tbody>
    <tbody class="b">
      <tr><td>B1</td><td>B2</td><td>B3</td></tr>
    </tbody>
    <tbody class="c">
      <tr><td>C1</td><td>C2</td><td>C3</td></tr>
      <tr><td>C4</td><td>C5</td><td>C6</td></tr>
    </tbody>
  </table>
</body>
</html>
