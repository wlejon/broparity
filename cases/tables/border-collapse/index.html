<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>border-collapse</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border-collapse: collapse;
    border: 4px solid #404040;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 2px solid #808080;
    background: #ffffff;
  }
</style>
</head>
<body>
  <table>
    <tr><td>r1c1</td><td>r1c2</td><td>r1c3</td></tr>
    <tr><td>r2c1</td><td>r2c2</td><td>r2c3</td></tr>
    <tr><td>r3c1</td><td>r3c2</td><td>r3c3</td></tr>
  </table>
</body>
</html>
