<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-layout-fixed</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    width: 600px;
    table-layout: fixed;
    border-collapse: collapse;
    border: 2px solid #404040;
    font-size: 16px;
    color: #202020;
  }
  col.a { width: 100px; }
  col.b { width: 200px; }
  col.c { width: 300px; }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
    overflow: hidden;
  }
</style>
</head>
<body>
  <table>
    <colgroup>
      <col class="a">
      <col class="b">
      <col class="c">
    </colgroup>
    <tr><td>narrow</td><td>medium width column</td><td>wide column gets the rest of the space</td></tr>
    <tr><td>x</td><td>y</td><td>z</td></tr>
  </table>
</body>
</html>
