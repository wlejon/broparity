<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-layout-fixed</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    width: 600px;
    table-layout: fixed;
    border-collapse: collapse;
    border: 2px solid #404040;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  col.a { width: 100px; }
  col.b { width: 200px; }
  col.c { width: 300px; }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
    overflow: hidden;
  }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .w3 { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <colgroup>
      <col class="a">
      <col class="b">
      <col class="c">
    </colgroup>
    <tr>
      <td><span class="w" style="width:56px"></span></td>
      <td><span class="w w2" style="width:64px"></span> <span class="w w2" style="width:48px"></span></td>
      <td><span class="w w3" style="width:72px"></span> <span class="w w3" style="width:56px"></span> <span class="w w3" style="width:64px"></span> <span class="w w3" style="width:48px"></span> <span class="w w3" style="width:60px"></span></td>
    </tr>
    <tr>
      <td><span class="w" style="width:16px"></span></td>
      <td><span class="w w2" style="width:16px"></span></td>
      <td><span class="w w3" style="width:16px"></span></td>
    </tr>
  </table>
</body>
</html>
