<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-margin-auto</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 40px auto;
    width: 400px;
    border: 2px solid #404040;
    border-collapse: collapse;
    background: #f0f0f0;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
    text-align: center;
  }
</style>
</head>
<body>
  <table>
    <tr><td>centered</td><td>table</td></tr>
    <tr><td>row 2</td><td>here</td></tr>
  </table>
</body>
</html>
