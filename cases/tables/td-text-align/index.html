<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>td-text-align</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    width: 200px;
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  td.l { text-align: left; }
  td.c { text-align: center; }
  td.r { text-align: right; }
</style>
</head>
<body>
  <table>
    <tr><td class="l">left</td><td class="c">center</td><td class="r">right</td></tr>
    <tr><td class="l">apple</td><td class="c">banana</td><td class="r">cherry</td></tr>
    <tr><td class="l">x</td><td class="c">y</td><td class="r">z</td></tr>
  </table>
</body>
</html>
