<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>td-text-align</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    width: 200px;
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  td.l { text-align: left; }
  td.c { text-align: center; }
  td.r { text-align: right; }
  /* word-like fixed-size inline-blocks: they align exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
  .w3 { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="l"><span class="w" style="width:48px"></span></td>
      <td class="c"><span class="w" style="width:64px"></span></td>
      <td class="r"><span class="w" style="width:56px"></span></td>
    </tr>
    <tr>
      <td class="l"><span class="w w2" style="width:52px"></span> <span class="w w2" style="width:36px"></span></td>
      <td class="c"><span class="w w2" style="width:60px"></span> <span class="w w2" style="width:28px"></span></td>
      <td class="r"><span class="w w2" style="width:44px"></span> <span class="w w2" style="width:40px"></span></td>
    </tr>
    <tr>
      <td class="l"><span class="w w3" style="width:16px"></span></td>
      <td class="c"><span class="w w3" style="width:16px"></span></td>
      <td class="r"><span class="w w3" style="width:16px"></span></td>
    </tr>
  </table>
</body>
</html>
