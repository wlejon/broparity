<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>thead-tfoot</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border-collapse: collapse;
    border: 2px solid #404040;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  th, td {
    padding: 8px 12px;
    border: 1px solid #808080;
  }
  thead { background: #d0d8e0; }
  tbody { background: #ffffff; }
  tfoot { background: #e8e0d0; font-weight: bold; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .wh { background: #555555; }
  .wf { background: #3060c8; }
</style>
</head>
<body>
  <table>
    <thead>
      <tr><th><span class="w wh" style="width:40px"></span></th><th><span class="w wh" style="width:32px"></span></th><th><span class="w wh" style="width:36px"></span></th></tr>
    </thead>
    <tbody>
      <tr><td><span class="w" style="width:52px"></span></td><td><span class="w" style="width:12px"></span></td><td><span class="w" style="width:32px"></span></td></tr>
      <tr><td><span class="w" style="width:44px"></span></td><td><span class="w" style="width:12px"></span></td><td><span class="w" style="width:32px"></span></td></tr>
      <tr><td><span class="w" style="width:36px"></span></td><td><span class="w" style="width:12px"></span></td><td><span class="w" style="width:32px"></span></td></tr>
    </tbody>
    <tfoot>
      <tr><td><span class="w wf" style="width:40px"></span></td><td><span class="w wf" style="width:12px"></span></td><td><span class="w wf" style="width:32px"></span></td></tr>
    </tfoot>
  </table>
</body>
</html>
