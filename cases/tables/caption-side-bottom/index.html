<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>caption-side-bottom</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  caption {
    caption-side: bottom;
    padding: 6px 0;
    font-weight: bold;
    color: #404040;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
</style>
</head>
<body>
  <table>
    <caption>Caption below</caption>
    <tr><td>a1</td><td>a2</td><td>a3</td></tr>
    <tr><td>b1</td><td>b2</td><td>b3</td></tr>
  </table>
</body>
</html>
