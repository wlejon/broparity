<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>td-width-explicit</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 20px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  .w100 { width: 100px; background: #ffe0e0; }
  .w200 { width: 200px; background: #e0ffe0; }
  .w300 { width: 300px; background: #e0e0ff; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  .w2 { background: #2f7a4d; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="w100"><span class="w" style="width:44px"></span></td>
      <td class="w200"><span class="w" style="width:44px"></span></td>
      <td class="w300"><span class="w" style="width:44px"></span></td>
    </tr>
    <tr>
      <td><span class="w w2" style="width:16px"></span></td>
      <td><span class="w w2" style="width:16px"></span></td>
      <td><span class="w w2" style="width:16px"></span></td>
    </tr>
  </table>
</body>
</html>
