<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>td-width-explicit</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: collapse;
    font-size: 16px;
    color: #202020;
  }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
    background: #ffffff;
  }
  .w100 { width: 100px; background: #ffe0e0; }
  .w200 { width: 200px; background: #e0ffe0; }
  .w300 { width: 300px; background: #e0e0ff; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="w100">100px</td>
      <td class="w200">200px</td>
      <td class="w300">300px</td>
    </tr>
    <tr>
      <td>a</td>
      <td>b</td>
      <td>c</td>
    </tr>
  </table>
</body>
</html>
