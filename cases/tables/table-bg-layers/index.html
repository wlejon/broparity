<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>table-bg-layers</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  table {
    margin: 20px;
    border: 2px solid #404040;
    border-collapse: separate;
    border-spacing: 6px;
    background: #ffd0d0;
    font-size: 16px;
    color: #202020;
  }
  tr.green { background: #b0e0b0; }
  tr.blue { background: #b0b0e0; }
  td {
    padding: 8px 12px;
    border: 1px solid #808080;
  }
  td.opaque { background: #ffffff; }
</style>
</head>
<body>
  <table>
    <tr class="green">
      <td>tr-bg</td>
      <td class="opaque">td-bg</td>
      <td>tr-bg</td>
    </tr>
    <tr class="blue">
      <td>tr-bg</td>
      <td>tr-bg</td>
      <td class="opaque">td-bg</td>
    </tr>
    <tr>
      <td>table-bg</td>
      <td class="opaque">td-bg</td>
      <td>table-bg</td>
    </tr>
  </table>
</body>
</html>
