<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>align-items-center</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #container {
    display: flex;
    align-items: center;
    width: 600px;
    height: 200px;
    margin: 20px;
    background: #eeeeee;
  }
  #container > div { width: 100px; background: #c0d0e0; }
  #a { height: 60px; }
  #b { height: 120px; background: #d0e0c0; }
  #c { height: 180px; background: #e0c0d0; }
</style>
</head>
<body>
  <div id="container">
    <div id="a">A</div>
    <div id="b">B</div>
    <div id="c">C</div>
  </div>
</body>
</html>
