<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>align-content-wrap</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #c { display: flex; flex-wrap: wrap; align-content: space-between; width: 220px; height: 300px; margin: 20px; background: #eeeeee; }
   #c > div { width: 100px; height: 60px; background: #c0d0e0; margin: 0 5px; }
   #c > div:nth-of-type(2) { background: #d0e0c0; }
   #c > div:nth-of-type(3) { background: #e0c0d0; }
   #c > div:nth-of-type(4) { background: #c0e0e0; }
</style>
</head>
<body>
<div id="c"><div></div><div></div><div></div><div></div></div>
</body>
</html>
