<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>flex-margin-auto</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #c { display: flex; width: 600px; height: 80px; margin: 20px; background: #eeeeee; }
   #c > div { width: 80px; height: 80px; background: #c0d0e0; }
   #b { background: #d0e0c0; margin-left: auto; }
   #d { background: #e0c0d0; }
</style>
</head>
<body>
<div id="c"><div id="a"></div><div id="b"></div><div id="d"></div></div>
</body>
</html>
