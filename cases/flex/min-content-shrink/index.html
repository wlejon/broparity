<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>min-content-shrink</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #container {
    display: flex;
    width: 300px;
    margin: 20px;
    background: #eeeeee;
    font-size: 16px;
  }
  #container > div {
    background: #c0d0e0;
    padding: 8px;
  }
  #container > div:nth-of-type(2) { background: #d0e0c0; }
  #container > div:nth-of-type(3) { background: #e0c0d0; }
</style>
</head>
<body>
  <div id="container">
    <div>Supercalifragilisticexpialidocious</div>
    <div>Pneumonoultramicroscopicsilicovolcanoconiosis</div>
    <div>Antidisestablishmentarianism</div>
  </div>
</body>
</html>
