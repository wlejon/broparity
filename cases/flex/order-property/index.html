<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>order-property</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #c { display: flex; width: 600px; height: 100px; margin: 20px; background: #eeeeee; }
   #c > div { width: 100px; height: 100px; background: #c0d0e0; }
   #a { order: 3; background: #c00000; }
   #b { order: 1; background: #00a000; }
   #d { order: 2; background: #0000c0; }
</style>
</head>
<body>
<div id="c"><div id="a">1</div><div id="b">2</div><div id="d">3</div></div>
</body>
</html>
