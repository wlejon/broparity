<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>reverse-directions</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .flex { display: flex; gap: 8px; margin: 10px; padding: 6px; background: #f0f0f0; width: 500px; }
  .cell { width: 90px; height: 36px; color: #ffffff; font-size: 12px; }
  .a { background: #c62828; }
  .b { background: #2e7d32; }
  .c { background: #1565c0; }

  #row-rev { flex-direction: row-reverse; }
  #col-rev { flex-direction: column-reverse; height: 160px; width: 140px; }
  #wrap-rev { flex-wrap: wrap-reverse; width: 320px; height: 120px; align-content: flex-start; }
</style>
</head>
<body>
  <!-- visual order right→left: a at right edge -->
  <div class="flex" id="row-rev">
    <div class="cell a">a</div><div class="cell b">b</div><div class="cell c">c</div>
  </div>
  <!-- visual order bottom→top: a at bottom -->
  <div class="flex" id="col-rev">
    <div class="cell a">a</div><div class="cell b">b</div><div class="cell c">c</div>
  </div>
  <!-- first line at the bottom -->
  <div class="flex" id="wrap-rev">
    <div class="cell a">1</div><div class="cell b">2</div><div class="cell c">3</div>
    <div class="cell a">4</div><div class="cell b">5</div>
  </div>
</body>
</html>
