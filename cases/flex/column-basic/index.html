<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>column-basic</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #container {
    display: flex;
    flex-direction: column;
    width: 200px;
    height: 400px;
    margin: 20px;
    background: #eeeeee;
  }
  #container > div {
    width: 200px;
    height: 80px;
    background: #c0d0e0;
  }
  #container > div:nth-of-type(2) { background: #d0e0c0; }
  #container > div:nth-of-type(3) { background: #e0c0d0; }
</style>
</head>
<body>
  <div id="container">
    <div>A</div>
    <div>B</div>
    <div>C</div>
  </div>
</body>
</html>
