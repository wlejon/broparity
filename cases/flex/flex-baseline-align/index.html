<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>flex-baseline-align</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #c { display: flex; align-items: baseline; width: 600px; height: 200px; margin: 20px; background: #eeeeee; }
   #c > div { width: 100px; background: #c0d0e0; padding: 10px; box-sizing: border-box; font-size: 16px; }
   #a { height: 60px; }
   #b { height: 100px; background: #d0e0c0; font-size: 32px; }
   #d { height: 80px; background: #e0c0d0; }
</style>
</head>
<body>
<div id="c"><div id="a">x</div><div id="b">x</div><div id="d">x</div></div>
</body>
</html>
