<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>flex-wrap</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #container {
    display: flex;
    flex-wrap: wrap;
    width: 300px;
    margin: 20px;
    background: #eeeeee;
  }
  #container > div {
    width: 100px;
    height: 60px;
    background: #c0d0e0;
  }
  #container > div:nth-of-type(even) { background: #d0e0c0; }
</style>
</head>
<body>
  <div id="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
  </div>
</body>
</html>
