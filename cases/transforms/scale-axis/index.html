<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>scale-axis</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 200px; margin: 20px; background: #eeeeee; position: relative; padding: 50px 0 0 100px; box-sizing: border-box; }
   #b { width: 80px; height: 80px; background: #008080; transform: scaleX(2); }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
