<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>rotate-deg</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 300px; margin: 20px; background: #eeeeee; position: relative; padding-top: 80px; padding-left: 150px; box-sizing: border-box; }
   #b { width: 100px; height: 100px; background: #4040c0; transform: rotate(45deg); }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
