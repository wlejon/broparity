<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transform-origin</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 300px; margin: 20px; background: #eeeeee; position: relative; padding: 80px 0 0 120px; box-sizing: border-box; }
   #b { width: 100px; height: 100px; background: #c04040; transform-origin: top left; transform: rotate(30deg); }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
