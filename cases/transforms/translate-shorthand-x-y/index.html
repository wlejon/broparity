<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>translate-shorthand-x-y</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 200px; margin: 20px; background: #eeeeee; position: relative; }
   #b { width: 80px; height: 80px; background: #a000a0; transform: translateX(120px) translateY(40px); }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
