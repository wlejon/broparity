<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transform-multiple</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 300px; margin: 20px; background: #eeeeee; position: relative; padding: 80px 0 0 100px; box-sizing: border-box; }
   #b { width: 100px; height: 100px; background: #6040c0; transform: translate(20px, 20px) rotate(15deg) scale(0.8); }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
