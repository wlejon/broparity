<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transform-3d-rotateX</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 300px; margin: 20px; background: #eeeeee; position: relative; padding: 80px 0 0 130px; box-sizing: border-box; perspective: 600px; }
   #b { width: 120px; height: 120px; background: #c08040; transform: rotateX(45deg); }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
