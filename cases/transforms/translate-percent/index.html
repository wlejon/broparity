<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>translate-percent</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; height: 200px; margin: 20px; background: #eeeeee; position: relative; }
   #b { width: 100px; height: 100px; background: #00a000; transform: translate(50%, 50%); }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
