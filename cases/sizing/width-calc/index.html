<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>width-calc</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; margin: 20px; background: #eeeeee; padding: 20px; box-sizing: border-box; }
   #b { width: calc(100% - 40px); height: 60px; background: #c0d0e0; }
</style>
</head>
<body>
<div id="root"><div id="b"></div></div>
</body>
</html>
