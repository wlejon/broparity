<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>min-max-width-clamp</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #root { width: 400px; margin: 20px; background: #eeeeee; }
   #a { width: 100px; min-width: 200px; height: 40px; background: #c00000; margin-bottom: 8px; }
   #b { width: 800px; max-width: 300px; height: 40px; background: #008000; }
</style>
</head>
<body>
<div id="root"><div id="a"></div><div id="b"></div></div>
</body>
</html>
