<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>checked-disabled-styling</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .row { margin: 10px; font-size: 14px; color: #202020; }
  label { display: inline-block; width: 220px; height: 24px; background: #dddddd; }

  /* statically-set states drive selector styling */
  input:checked + label { background: #2e7d32; color: #ffffff; }
  input:disabled + label { background: #c62828; color: #ffffff; }
  input:checked:disabled + label { background: #6a1b9a; color: #ffffff; }
  input:enabled + label { border-left: 10px solid #1565c0; }
</style>
</head>
<body>
  <div class="row"><input type="checkbox" checked><label>checked (green)</label></div>
  <div class="row"><input type="checkbox"><label>unchecked (grey, blue edge)</label></div>
  <div class="row"><input type="checkbox" disabled><label>disabled (red)</label></div>
  <div class="row"><input type="checkbox" checked disabled><label>checked+disabled (purple)</label></div>
  <div class="row"><input type="radio" name="r" checked><label>radio checked (green)</label></div>
  <div class="row"><input type="radio" name="r"><label>radio unchecked (grey, blue edge)</label></div>
</body>
</html>
