<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>checked-disabled-styling</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .row { margin: 10px; font-size: 14px; color: #202020; line-height: 24px; }
  label { display: inline-block; width: 220px; height: 24px; background: #dddddd; }
  .w { display: inline-block; height: 14px; vertical-align: top; background: #b04030; }
  input { line-height: normal; }

  /* statically-set states drive selector styling */
  input:checked + label { background: #2e7d32; color: #ffffff; }
  input:disabled + label { background: #c62828; color: #ffffff; }
  input:checked:disabled + label { background: #6a1b9a; color: #ffffff; }
  input:enabled + label { border-left: 10px solid #1565c0; }
</style>
</head>
<body>
  <div class="row"><input type="checkbox" checked><label><span class="w" style="width:56px"></span> <span class="w" style="width:44px"></span></label></div>
  <div class="row"><input type="checkbox"><label><span class="w" style="width:72px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:60px"></span></label></div>
  <div class="row"><input type="checkbox" disabled><label><span class="w" style="width:60px"></span> <span class="w" style="width:32px"></span></label></div>
  <div class="row"><input type="checkbox" checked disabled><label><span class="w" style="width:88px"></span> <span class="w" style="width:52px"></span></label></div>
  <div class="row"><input type="radio" name="r" checked><label><span class="w" style="width:40px"></span> <span class="w" style="width:56px"></span> <span class="w" style="width:44px"></span></label></div>
  <div class="row"><input type="radio" name="r"><label><span class="w" style="width:40px"></span> <span class="w" style="width:72px"></span> <span class="w" style="width:36px"></span></label></div>
</body>
</html>
