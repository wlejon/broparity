<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>input-sizes</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #wrap { margin: 20px; }
  .row { margin-bottom: 14px; }
  input { font-family: sans-serif; font-size: 16px; }
  #i-width { width: 200px; }
  #i-borderbox { width: 200px; padding: 10px; border: 4px solid #3060c0; box-sizing: border-box; background: #dce8f8; }
  #i-contentbox { width: 200px; padding: 10px; border: 4px solid #c05030; box-sizing: content-box; background: #f8e4dc; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="row"><input id="i-text" type="text"></div>
    <div class="row"><input id="i-pass" type="password"></div>
    <div class="row"><input id="i-num" type="number"></div>
    <div class="row"><input id="i-width" type="text"></div>
    <div class="row"><input id="i-borderbox" type="text"></div>
    <div class="row"><input id="i-contentbox" type="text"></div>
  </div>
</body>
</html>
