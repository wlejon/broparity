<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>select-single</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #wrap { margin: 20px; }
  .row { margin-bottom: 16px; }
  select { font-family: sans-serif; font-size: 16px; }
  #s-fixed { width: 120px; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="row">
      <select id="s-bare">
        <option>One</option>
        <option>Two</option>
        <option>Three</option>
      </select>
    </div>
    <div class="row">
      <select id="s-fixed">
        <option>Alpha</option>
        <option>Beta</option>
      </select>
    </div>
    <div class="row">
      <select id="s-long">
        <option>Short</option>
        <option>A considerably longer option label that sets the width</option>
      </select>
    </div>
  </div>
</body>
</html>
