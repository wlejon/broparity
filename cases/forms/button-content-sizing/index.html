<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>button-content-sizing</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #wrap { margin: 20px; }
  .row { margin-bottom: 16px; }
  button, input { font-family: sans-serif; font-size: 16px; }
  #b-fixed { width: 160px; }
  #b-pad { padding: 4px 30px; background: #dce8f8; border: 2px solid #3060c0; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="row"><button id="b-text">Save</button></div>
    <div class="row"><button id="b-fixed">Save</button></div>
    <div class="row"><button id="b-pad">Save</button></div>
    <div class="row">
      <button id="b-submit">Submit</button>
      <input id="i-submit" type="submit" value="Submit">
    </div>
  </div>
</body>
</html>
