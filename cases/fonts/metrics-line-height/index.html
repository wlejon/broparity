<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>metrics-line-height</title>
<style>
  @font-face { font-family: "ParityBungee"; src: url("Bungee-Regular.ttf"); }
  html, body { margin: 0; padding: 0; background: #fff; }
  /* line-height: normal resolution: each block's height = the font's
     resolved normal line height at that size (ascent/descent/leading
     rounding). Webfont + Arial, ramped sizes. */
  .b { font-family: "ParityBungee"; }
  .a { font-family: Arial, sans-serif; }
  .m { display: inline-block; line-height: normal; white-space: nowrap;
       background: #ffe9d6; color: #8a4b1f; }
  div.row { margin: 2px 8px; }
</style>
</head>
<body>
  <div class="row"><span class="m a" style="font-size: 8px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 11px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 12px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 13.333px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 16px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 20px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 24px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 32px">XgQ</span></div>
  <div class="row"><span class="m a" style="font-size: 48px">XgQ</span></div>
  <div class="row"><span class="m b" style="font-size: 8px">XGQ</span></div>
  <div class="row"><span class="m b" style="font-size: 12px">XGQ</span></div>
  <div class="row"><span class="m b" style="font-size: 16px">XGQ</span></div>
  <div class="row"><span class="m b" style="font-size: 24px">XGQ</span></div>
  <div class="row"><span class="m b" style="font-size: 32px">XGQ</span></div>
  <div class="row"><span class="m b" style="font-size: 48px">XGQ</span></div>
</body>
</html>
