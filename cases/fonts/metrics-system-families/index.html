<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>metrics-system-families</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  /* System fonts are the same files for both engines on one machine, so
     any advance/height delta here is pipeline, not font. Named families
     plus the generic keywords (incl. the 13px monospace default quirk). */
  .m { display: inline-block; font-size: 16px; line-height: normal;
       white-space: nowrap; background: #e8f2e8; color: #2e5b2e; }
  div.row { margin: 3px 8px; }
</style>
</head>
<body>
  <div class="row"><span class="m" style="font-family: Arial">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: 'Times New Roman'">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: 'Courier New'">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: Verdana">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: Georgia">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: 'Segoe UI'">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: Tahoma">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: sans-serif">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: serif">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: monospace">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: Arial; font-weight: bold">Handgloves 0123 milliVW</span></div>
  <div class="row"><span class="m" style="font-family: Arial; font-style: italic">Handgloves 0123 milliVW</span></div>
</body>
</html>
