<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>font-face-ttf</title>
<style>
  @font-face {
    font-family: "ParityBungee";
    src: url("Bungee-Regular.ttf");
  }
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  .custom {
    font-family: "ParityBungee";
    font-size: 32px;
    margin: 16px;
    color: #1565c0;
    background: #f0f0f0;
  }
  .fallback {
    font-family: sans-serif;
    font-size: 32px;
    margin: 16px;
    color: #2e7d32;
    background: #f0f0f0;
  }
  .inline-size { display: inline-block; }
</style>
</head>
<body>
  <div class="custom">HELLO BUNGEE 0123</div>
  <div class="fallback">HELLO SANS 0123</div>
  <div class="custom inline-size">SIZED BY FONT</div>
</body>
</html>
