<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>vertical-align-inline</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  #line {
    width: 740px;
    margin: 40px 20px;
    font-size: 16px;
    line-height: 20px;
    background: #eef0ff;
  }
  #line span { background: #ffd8a8; }
  #va-sub  { vertical-align: sub; }
  #va-sup  { vertical-align: super; }
  #va-ttop { vertical-align: text-top; }
  #va-tbot { vertical-align: text-bottom; }
  #va-mid  { vertical-align: middle; }
  #va-px   { vertical-align: 6px; }
  #va-neg  { vertical-align: -25%; }
</style>
</head>
<body>
  <div id="line">base <span id="va-sub">sub</span> base <span id="va-sup">super</span> base <span id="va-ttop">ttop</span> base <span id="va-tbot">tbot</span> base <span id="va-mid">middle</span> base <span id="va-px">px6</span> base <span id="va-neg">neg25</span> base</div>
</body>
</html>
