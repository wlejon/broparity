<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>rtl-table</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  table {
    border-collapse: collapse;
    margin: 20px;
  }
  td {
    width: 80px;
    height: 32px;
    padding: 0;
    font-size: 14px;
    line-height: 20px;
    border: 1px solid #808080;
  }
  .c1 { background: #f0b0a8; }
  .c2 { background: #b0e0b8; }
  .c3 { background: #a8c0f0; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <table dir="rtl" id="tab-rtl">
    <tr>
      <td class="c1" id="rc1"><span class="w" style="width:32px"></span></td>
      <td class="c2" id="rc2"><span class="w" style="width:40px"></span></td>
      <td class="c3" id="rc3"><span class="w" style="width:48px"></span></td>
    </tr>
    <tr>
      <td id="rd1"><span class="w" style="width:16px; background:#8a5030"></span></td>
      <td id="rd2"><span class="w" style="width:20px; background:#8a5030"></span></td>
      <td id="rd3"><span class="w" style="width:24px; background:#8a5030"></span></td>
    </tr>
  </table>
  <table dir="ltr" id="tab-ltr">
    <tr>
      <td class="c1" id="lc1"><span class="w" style="width:32px"></span></td>
      <td class="c2" id="lc2"><span class="w" style="width:40px"></span></td>
      <td class="c3" id="lc3"><span class="w" style="width:48px"></span></td>
    </tr>
    <tr>
      <td id="ld1"><span class="w" style="width:16px; background:#8a5030"></span></td>
      <td id="ld2"><span class="w" style="width:20px; background:#8a5030"></span></td>
      <td id="ld3"><span class="w" style="width:24px; background:#8a5030"></span></td>
    </tr>
  </table>
</body>
</html>
