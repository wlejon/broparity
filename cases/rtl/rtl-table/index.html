<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>rtl-table</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  table {
    border-collapse: collapse;
    margin: 20px;
  }
  td {
    width: 80px;
    height: 32px;
    padding: 0;
    font-size: 14px;
    border: 1px solid #808080;
  }
  .c1 { background: #f0b0a8; }
  .c2 { background: #b0e0b8; }
  .c3 { background: #a8c0f0; }
</style>
</head>
<body>
  <table dir="rtl" id="tab-rtl">
    <tr>
      <td class="c1" id="rc1">one</td>
      <td class="c2" id="rc2">two</td>
      <td class="c3" id="rc3">three</td>
    </tr>
    <tr>
      <td id="rd1">a</td>
      <td id="rd2">b</td>
      <td id="rd3">c</td>
    </tr>
  </table>
  <table dir="ltr" id="tab-ltr">
    <tr>
      <td class="c1" id="lc1">one</td>
      <td class="c2" id="lc2">two</td>
      <td class="c3" id="lc3">three</td>
    </tr>
    <tr>
      <td id="ld1">a</td>
      <td id="ld2">b</td>
      <td id="ld3">c</td>
    </tr>
  </table>
</body>
</html>
