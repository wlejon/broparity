<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>rtl-flex-row</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  .row {
    display: flex;
    width: 360px;
    margin: 20px;
    background: #eeeeee;
  }
  .it { width: 60px; height: 40px; }
  .c1 { background: #d04030; }
  .c2 { background: #2f9e56; }
  .c3 { background: #3060c8; }
</style>
</head>
<body>
  <div class="row" dir="rtl" id="row-rtl">
    <div class="it c1" id="r1"></div>
    <div class="it c2" id="r2"></div>
    <div class="it c3" id="r3"></div>
  </div>
  <div class="row" dir="ltr" id="row-ltr">
    <div class="it c1" id="l1"></div>
    <div class="it c2" id="l2"></div>
    <div class="it c3" id="l3"></div>
  </div>
</body>
</html>
