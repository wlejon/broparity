<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>direction-rtl-block</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  .box {
    width: 360px;
    margin: 14px 20px;
    font-size: 14px;
    line-height: 20px;
    background: #f0f0f0;
  }
  .box p { margin: 6px; background: #e0e8ff; }
  /* the tested dir="ltr" spans, given word-like fixed boxes so their
     bidi ordering is asserted without font-metric pixel drift */
  .a { background: #ffc8c8; display: inline-block; width: 44px; height: 14px; vertical-align: top; }
  .b { background: #c8e8c8; display: inline-block; width: 60px; height: 14px; vertical-align: top; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
  <div class="box" dir="rtl">
    <p id="rp"><span class="w" style="width:48px"></span> <span class="w" style="width:64px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:56px"></span> <span class="w" style="width:40px"></span></p>
    <p><span dir="ltr" class="a" id="ra"></span> <span dir="ltr" class="b" id="rb"></span></p>
  </div>
  <div class="box" dir="ltr">
    <p id="lp"><span class="w" style="width:48px"></span> <span class="w" style="width:64px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:56px"></span> <span class="w" style="width:40px"></span></p>
    <p><span dir="ltr" class="a" id="la"></span> <span dir="ltr" class="b" id="lb"></span></p>
  </div>
</body>
</html>
