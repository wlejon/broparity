<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>text-bidi-controls</title>
<style>
  /* The bidi formatting characters. They carry no glyph and no advance — they
     exist only to change how the characters around them resolve. Two things
     can go wrong and both are visible here: an engine that ignores them
     reorders the line wrongly, and an engine that shapes them draws a .notdef
     box per control, which moves every rect on the line.

     The <code> rows have a fixed width, so any width contributed by a control
     shows up as a rect mismatch rather than only as a pixel diff. */
  html, body { margin: 0; padding: 0; background: #fff; color: #202020; }
  .p { font-family: Arial; font-size: 20px; line-height: 28px;
       width: 560px; margin: 10px; background: #f4f4f4; }
  .w { background: #ffe8d0; }
  .h { background: #e0ffe0; }
  .n { background: #d8e8ff; }
</style>
</head>
<body>
  <!-- LRM / RLM: invisible marks that give a neutral run a direction.
       "abc" then RLM then "!" — the neutral punctuation joins the RTL side. -->
  <p class="p" dir="ltr" id="p1"><span class="n" id="a1">abc&#x200F;</span> <span class="h" id="a2">שלום</span></p>
  <p class="p" dir="ltr" id="p2"><span class="n" id="b1">abc&#x200E;</span> <span class="h" id="b2">שלום</span></p>

  <!-- RLE ... PDF: an explicit right-to-left embedding around Latin text.
       The Latin resolves to level 2 and the run as a whole reverses. -->
  <p class="p" dir="ltr" id="p3"><span class="n" id="c1">x</span> <span class="n" id="c2">&#x202B;one two&#x202C;</span> <span class="n" id="c3">y</span></p>

  <!-- LRE ... PDF inside an RTL paragraph. -->
  <p class="p" dir="rtl" id="p4"><span class="w" id="d1">مرحبا</span> <span class="n" id="d2">&#x202A;one two&#x202C;</span> <span class="w" id="d3">بالعالم</span></p>

  <!-- Controls must not occupy width. Both rows carry the same visible text;
       the second one is peppered with formatting characters, so the two rows
       must lay out identically. -->
  <p class="p" dir="ltr" id="p5"><span class="n" id="e1">abcdef</span></p>
  <p class="p" dir="ltr" id="p6"><span class="n" id="e2">&#x200E;abc&#x200F;&#x202A;&#x202C;def&#x200E;</span></p>

  <!-- The isolate controls (LRI/RLI/FSI/PDI). They also carry no width, and
       the text between an initiator and its PDI resolves on its own. -->
  <p class="p" dir="ltr" id="p7"><span class="n" id="f1">a</span> <span class="h" id="f2">&#x2067;שלום עולם&#x2069;</span> <span class="n" id="f3">b</span></p>
  <p class="p" dir="ltr" id="p8"><span class="n" id="g1">a</span> <span class="h" id="g2">&#x2068;שלום עולם&#x2069;</span> <span class="n" id="g3">b</span></p>

  <!-- Raw text for the pixel comparison. -->
  <p class="p" dir="ltr" id="p9">a&#x202B;שלום עולם&#x202C;b</p>
</body>
</html>
