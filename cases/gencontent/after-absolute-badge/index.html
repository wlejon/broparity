<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>after-absolute-badge</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; }
  .card { position: relative; display: inline-block; vertical-align: top; width: 200px; height: 120px; margin: 30px; background: #eceff1; border: 1px solid #90a4ae; }
  #pseudo::after { content: ""; position: absolute; top: -8px; right: -8px; width: 16px; height: 16px; background: #d32f2f; border-radius: 50%; }
  #realbadge { position: absolute; top: -8px; right: -8px; width: 16px; height: 16px; background: #d32f2f; border-radius: 50%; }
</style>
</head>
<body>
<div id="pseudo" class="card"></div>
<div id="control" class="card"><div id="realbadge"></div></div>
</body>
</html>
