<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>li-block-content</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  ul { width: 420px; }
  li { background: #e6e0f5; }
  #p1 { background: #c2d8f0; }
  #d1 { margin: 12px 0; background: #f0d0c2; }
</style>
</head>
<body>
<ul id="list">
  <li id="li1">
    <p id="p1">Paragraph inside a list item with default margins</p>
    <div id="d1">Div with its own vertical margins</div>
  </li>
  <li id="li2">Second item with plain inline text</li>
</ul>
</body>
</html>
