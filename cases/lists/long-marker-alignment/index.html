<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>long-marker-alignment</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  ol { width: 320px; }
  li { background: #cfe8ff; }
  #in { list-style-position: inside; }
  #in li { background: #ffe2b8; }
</style>
</head>
<body>
<ol id="out" start="98">
  <li id="o98">Item ninety eight</li>
  <li id="o99">Item ninety nine</li>
  <li id="o100">Item one hundred</li>
  <li id="o101">Item one oh one</li>
  <li id="o102">Item one oh two</li>
</ol>
<ol id="in" start="98">
  <li id="i98">Item ninety eight</li>
  <li id="i99">Item ninety nine</li>
  <li id="i100">Item one hundred</li>
  <li id="i101">Item one oh one</li>
  <li id="i102">Item one oh two</li>
</ol>
</body>
</html>
