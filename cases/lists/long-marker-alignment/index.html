<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>long-marker-alignment</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  ol { width: 320px; line-height: 20px; }
  li { background: #cfe8ff; }
  #in { list-style-position: inside; }
  #in li { background: #ffe2b8; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
<ol id="out" start="98">
  <li id="o98"><span class="w" style="width:44px"></span> <span class="w" style="width:60px"></span> <span class="w" style="width:36px"></span></li>
  <li id="o99"><span class="w" style="width:44px"></span> <span class="w" style="width:64px"></span> <span class="w" style="width:32px"></span></li>
  <li id="o100"><span class="w" style="width:44px"></span> <span class="w" style="width:56px"></span> <span class="w" style="width:48px"></span></li>
  <li id="o101"><span class="w" style="width:44px"></span> <span class="w" style="width:40px"></span> <span class="w" style="width:36px"></span></li>
  <li id="o102"><span class="w" style="width:44px"></span> <span class="w" style="width:40px"></span> <span class="w" style="width:44px"></span></li>
</ol>
<ol id="in" start="98">
  <li id="i98"><span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:60px; background:#8a5030"></span> <span class="w" style="width:36px; background:#8a5030"></span></li>
  <li id="i99"><span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:64px; background:#8a5030"></span> <span class="w" style="width:32px; background:#8a5030"></span></li>
  <li id="i100"><span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:56px; background:#8a5030"></span> <span class="w" style="width:48px; background:#8a5030"></span></li>
  <li id="i101"><span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:40px; background:#8a5030"></span> <span class="w" style="width:36px; background:#8a5030"></span></li>
  <li id="i102"><span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:40px; background:#8a5030"></span> <span class="w" style="width:44px; background:#8a5030"></span></li>
</ol>
</body>
</html>
