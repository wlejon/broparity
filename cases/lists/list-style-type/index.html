<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>list-style-type</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  #row { display: flex; width: 760px; }
  #row > ul { width: 180px; }
  li { background: #d8e2f5; }
  #u1 { list-style-type: decimal; }
  #u2 { list-style-type: lower-alpha; }
  #u3 { list-style-type: upper-roman; }
  #u4 { list-style-type: none; }
</style>
</head>
<body>
<div id="row">
  <ul id="u1">
    <li id="a1">Item one</li>
    <li id="a2">Item two</li>
    <li id="a3">Item three</li>
  </ul>
  <ul id="u2">
    <li id="b1">Item one</li>
    <li id="b2">Item two</li>
    <li id="b3">Item three</li>
  </ul>
  <ul id="u3">
    <li id="c1">Item one</li>
    <li id="c2">Item two</li>
    <li id="c3">Item three</li>
  </ul>
  <ul id="u4">
    <li id="d1">Item one</li>
    <li id="d2">Item two</li>
    <li id="d3">Item three</li>
  </ul>
</div>
</body>
</html>
