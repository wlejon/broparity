<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>list-style-type</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  #row { display: flex; width: 760px; }
  #row > ul { width: 180px; line-height: 20px; }
  li { background: #d8e2f5; }
  #u1 { list-style-type: decimal; }
  #u2 { list-style-type: lower-alpha; }
  #u3 { list-style-type: upper-roman; }
  #u4 { list-style-type: none; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
<div id="row">
  <ul id="u1">
    <li id="a1"><span class="w" style="width:48px"></span> <span class="w" style="width:32px"></span></li>
    <li id="a2"><span class="w" style="width:48px"></span> <span class="w" style="width:36px"></span></li>
    <li id="a3"><span class="w" style="width:48px"></span> <span class="w" style="width:44px"></span></li>
  </ul>
  <ul id="u2">
    <li id="b1"><span class="w" style="width:48px; background:#8a5030"></span> <span class="w" style="width:32px; background:#8a5030"></span></li>
    <li id="b2"><span class="w" style="width:48px; background:#8a5030"></span> <span class="w" style="width:36px; background:#8a5030"></span></li>
    <li id="b3"><span class="w" style="width:48px; background:#8a5030"></span> <span class="w" style="width:44px; background:#8a5030"></span></li>
  </ul>
  <ul id="u3">
    <li id="c1"><span class="w" style="width:48px; background:#3a6a4a"></span> <span class="w" style="width:32px; background:#3a6a4a"></span></li>
    <li id="c2"><span class="w" style="width:48px; background:#3a6a4a"></span> <span class="w" style="width:36px; background:#3a6a4a"></span></li>
    <li id="c3"><span class="w" style="width:48px; background:#3a6a4a"></span> <span class="w" style="width:44px; background:#3a6a4a"></span></li>
  </ul>
  <ul id="u4">
    <li id="d1"><span class="w" style="width:48px; background:#8a3040"></span> <span class="w" style="width:32px; background:#8a3040"></span></li>
    <li id="d2"><span class="w" style="width:48px; background:#8a3040"></span> <span class="w" style="width:36px; background:#8a3040"></span></li>
    <li id="d3"><span class="w" style="width:48px; background:#8a3040"></span> <span class="w" style="width:44px; background:#8a3040"></span></li>
  </ul>
</div>
</body>
</html>
