<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dl-definition</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  dl { width: 420px; background: #f4f4f4; }
  dt { background: #c8e6c8; }
  dd { background: #f5d8b8; }
</style>
</head>
<body>
<dl id="defs">
  <dt id="t1">First term</dt>
  <dd id="d1">Definition of the first term</dd>
  <dt id="t2">Second term</dt>
  <dd id="d2">Definition of the second term</dd>
</dl>
</body>
</html>
