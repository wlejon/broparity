<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dl-definition</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  dl { width: 420px; background: #f4f4f4; line-height: 20px; }
  dt { background: #c8e6c8; }
  dd { background: #f5d8b8; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
<dl id="defs">
  <dt id="t1"><span class="w" style="width:64px"></span> <span class="w" style="width:40px"></span></dt>
  <dd id="d1"><span class="w" style="width:80px; background:#8a5030"></span> <span class="w" style="width:28px; background:#8a5030"></span> <span class="w" style="width:36px; background:#8a5030"></span> <span class="w" style="width:52px; background:#8a5030"></span> <span class="w" style="width:40px; background:#8a5030"></span></dd>
  <dt id="t2"><span class="w" style="width:72px"></span> <span class="w" style="width:40px"></span></dt>
  <dd id="d2"><span class="w" style="width:80px; background:#8a5030"></span> <span class="w" style="width:28px; background:#8a5030"></span> <span class="w" style="width:36px; background:#8a5030"></span> <span class="w" style="width:60px; background:#8a5030"></span> <span class="w" style="width:44px; background:#8a5030"></span></dd>
</dl>
</body>
</html>
