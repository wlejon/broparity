<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>list-in-flex</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  #fx { display: flex; list-style: none; margin: 0; padding: 0; width: 600px; }
  #fx li { flex: 1; padding: 10px; margin-right: 6px; background: #b8d8b8; text-align: center; }
  #ctrl { width: 300px; }
  #c1 { background: #f5d8d8; }
</style>
</head>
<body>
<ul id="fx">
  <li id="f1">One</li>
  <li id="f2">Two</li>
  <li id="f3">Three</li>
</ul>
<ul id="ctrl">
  <li id="c1">Control list item with default marker</li>
</ul>
</body>
</html>
