<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ol-numbering</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  ol { width: 360px; }
  li { background: #ffe6c2; }
</style>
</head>
<body>
<ol id="a" start="5">
  <li id="a1">Starts at five</li>
  <li id="a2">Then six</li>
  <li id="a3">Then seven</li>
  <li id="a4">Then eight</li>
</ol>
<ol id="b">
  <li id="b1">One</li>
  <li id="b2">Two</li>
  <li id="b3" value="10">Jumps to ten</li>
  <li id="b4">Then eleven</li>
  <li id="b5">Then twelve</li>
</ol>
</body>
</html>
