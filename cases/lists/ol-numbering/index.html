<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ol-numbering</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  ol { width: 360px; line-height: 20px; }
  li { background: #ffe6c2; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
<ol id="a" start="5">
  <li id="a1"><span class="w" style="width:48px"></span> <span class="w" style="width:28px"></span> <span class="w" style="width:32px"></span></li>
  <li id="a2"><span class="w" style="width:40px"></span> <span class="w" style="width:24px"></span></li>
  <li id="a3"><span class="w" style="width:40px"></span> <span class="w" style="width:44px"></span></li>
  <li id="a4"><span class="w" style="width:40px"></span> <span class="w" style="width:36px"></span></li>
</ol>
<ol id="b">
  <li id="b1"><span class="w" style="width:28px; background:#8a5030"></span></li>
  <li id="b2"><span class="w" style="width:28px; background:#8a5030"></span></li>
  <li id="b3" value="10"><span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:16px; background:#8a5030"></span> <span class="w" style="width:24px; background:#8a5030"></span></li>
  <li id="b4"><span class="w" style="width:40px; background:#8a5030"></span> <span class="w" style="width:44px; background:#8a5030"></span></li>
  <li id="b5"><span class="w" style="width:40px; background:#8a5030"></span> <span class="w" style="width:44px; background:#8a5030"></span></li>
</ol>
</body>
</html>
