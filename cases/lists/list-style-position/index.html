<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>list-style-position</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  ul { width: 260px; }
  li { background: #ffe2b8; }
  #in { list-style-position: inside; }
  #out { list-style-position: outside; }
</style>
</head>
<body>
<ul id="in">
  <li id="in1">Short item</li>
  <li id="in2">A longer wrapping item that continues onto a second line here</li>
</ul>
<ul id="out">
  <li id="out1">Short item</li>
  <li id="out2">A longer wrapping item that continues onto a second line here</li>
</ul>
</body>
</html>
