<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>nested-lists</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  li { background: #d8ecd8; line-height: 20px; }
  ol li { background: #f5d8d8; }
  /* word-like fixed-size inline-blocks: align/wrap exactly like text runs
     but carry no font-metric pixel drift */
  .w { display: inline-block; height: 14px; vertical-align: top; background: #204060; }
</style>
</head>
<body>
<ul id="l1">
  <li id="a"><span class="w" style="width:52px"></span> <span class="w" style="width:44px"></span> <span class="w" style="width:32px"></span>
    <ul id="l2">
      <li id="b"><span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:36px; background:#8a5030"></span>
        <ul id="l3">
          <li id="c"><span class="w" style="width:60px; background:#3a6a4a"></span> <span class="w" style="width:44px; background:#3a6a4a"></span> <span class="w" style="width:40px; background:#3a6a4a"></span></li>
          <li id="d"><span class="w" style="width:48px; background:#3a6a4a"></span> <span class="w" style="width:44px; background:#3a6a4a"></span> <span class="w" style="width:40px; background:#3a6a4a"></span></li>
        </ul>
      </li>
      <li id="e"><span class="w" style="width:64px; background:#8a5030"></span> <span class="w" style="width:44px; background:#8a5030"></span> <span class="w" style="width:32px; background:#8a5030"></span></li>
    </ul>
  </li>
  <li id="f"><span class="w" style="width:36px"></span> <span class="w" style="width:44px"></span> <span class="w" style="width:32px"></span></li>
</ul>
<ul id="m1">
  <li id="g"><span class="w" style="width:36px"></span> <span class="w" style="width:36px"></span> <span class="w" style="width:52px"></span> <span class="w" style="width:60px"></span> <span class="w" style="width:28px"></span>
    <ol id="m2">
      <li id="h"><span class="w" style="width:60px; background:#8a3040"></span> <span class="w" style="width:32px; background:#8a3040"></span></li>
      <li id="i"><span class="w" style="width:60px; background:#8a3040"></span> <span class="w" style="width:36px; background:#8a3040"></span></li>
    </ol>
  </li>
</ul>
</body>
</html>
