<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>nested-lists</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  li { background: #d8ecd8; }
  ol li { background: #f5d8d8; }
</style>
</head>
<body>
<ul id="l1">
  <li id="a">Alpha level one
    <ul id="l2">
      <li id="b">Beta level two
        <ul id="l3">
          <li id="c">Gamma level three</li>
          <li id="d">Delta level three</li>
        </ul>
      </li>
      <li id="e">Epsilon level two</li>
    </ul>
  </li>
  <li id="f">Zeta level one</li>
</ul>
<ul id="m1">
  <li id="g">Item with nested ordered list
    <ol id="m2">
      <li id="h">Ordered one</li>
      <li id="i">Ordered two</li>
    </ol>
  </li>
</ul>
</body>
</html>
