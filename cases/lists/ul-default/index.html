<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ul-default</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  #wrap { width: 400px; border: 1px solid #909090; background: #f4f4f4; }
  li { background: #cfe8ff; }
</style>
</head>
<body>
<div id="wrap">
  <ul id="list">
    <li id="i1">Alpha</li>
    <li id="i2">Bravo</li>
    <li id="i3">Charlie</li>
    <li id="i4">Delta</li>
  </ul>
</div>
</body>
</html>
