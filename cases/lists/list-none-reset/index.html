<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>list-none-reset</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; font-size: 16px; color: #202020; }
  #nav { list-style: none; margin: 0; padding: 0; width: 600px; background: #333a44; }
  #nav li { display: inline-block; padding: 8px 16px; margin-right: 4px; background: #4a6ea0; color: #ffffff; }
</style>
</head>
<body>
<ul id="nav">
  <li id="n1">Home</li>
  <li id="n2">Products</li>
  <li id="n3">About</li>
  <li id="n4">Contact</li>
</ul>
</body>
</html>
