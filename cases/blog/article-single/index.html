<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>article-single</title>
<style>
  html, body { margin: 0; padding: 0; font-size: 0; background: #fbfbfa; }
  .page { width: 800px; height: 600px; overflow: hidden; }
  .topbar { height: 50px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #ececec; background: #fff; }
  .brand { width: 90px; height: 16px; background: #1a1a1a; border-radius: 3px; }
  .article { width: 520px; margin: 0 auto; padding: 36px 0; }
  .kicker { width: 100px; height: 12px; background: #d23f5b; border-radius: 6px; margin-bottom: 16px; }
  .title { height: 28px; background: #16181d; border-radius: 5px; margin-bottom: 10px; }
  .title.l1 { width: 100%; }
  .title.l2 { width: 70%; }
  .meta { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #d23f5b, #f0a05b); }
  .meta-lines { display: flex; flex-direction: column; gap: 6px; }
  .m-name { width: 120px; height: 11px; background: #2a2a2a; border-radius: 5px; }
  .m-date { width: 80px; height: 9px; background: #b5b5b5; border-radius: 4px; }
  .cover { width: 520px; height: 200px; background: linear-gradient(135deg, #2a3654, #d23f5b); border-radius: 10px; margin-bottom: 24px; }
  .p { height: 10px; background: #cfcfcf; border-radius: 5px; margin-bottom: 11px; }
  .p.w1 { width: 100%; }
  .p.w2 { width: 96%; }
  .p.w3 { width: 88%; }
  .p.w4 { width: 60%; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><div class="brand"></div></div>
  <div class="article">
    <div class="kicker"></div>
    <div class="title l1"></div>
    <div class="title l2"></div>
    <div class="meta">
      <div class="avatar"></div>
      <div class="meta-lines"><div class="m-name"></div><div class="m-date"></div></div>
    </div>
    <div class="cover"></div>
    <div class="p w1"></div>
    <div class="p w2"></div>
    <div class="p w3"></div>
    <div class="p w4"></div>
  </div>
</div>
</body>
</html>
