<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dialog-modal</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2d36; font-size: 0; }
  .screen { width: 800px; height: 600px; position: relative; overflow: hidden; }
  .game-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #2c4d6d, #4d2c4d); }
  .game-shape { position: absolute; background: rgba(255,255,255,0.1); border-radius: 8px; }
  .gs1 { top: 100px; left: 100px; width: 120px; height: 80px; }
  .gs2 { top: 300px; left: 500px; width: 160px; height: 100px; }
  .gs3 { top: 200px; left: 400px; width: 80px; height: 80px; border-radius: 50%; }
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.65); }
  .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 480px; background: #2c303a; border: 2px solid #888; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); overflow: hidden; }
  .m-header { width: 100%; height: 36px; background: linear-gradient(180deg, #555, #333); border-bottom: 1px solid #888; }
  .m-body { display: flex; padding: 16px; gap: 16px; }
  .m-left { flex: 0 0 60%; height: 140px; background: #1a1d26; border: 1px solid #555; border-radius: 4px; padding: 10px; box-sizing: border-box; }
  .m-line { width: 100%; height: 8px; background: #555; border-radius: 2px; margin-bottom: 8px; }
  .m-line.short { width: 60%; }
  .m-line.med { width: 80%; }
  .m-right { flex: 1; height: 140px; background: linear-gradient(135deg, #5b9bff, #204080); border-radius: 4px; }
  .m-buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; background: #1a1d26; border-top: 1px solid #555; }
  .btn { width: 80px; height: 30px; border-radius: 4px; border: 1px solid #888; background: linear-gradient(180deg, #555, #333); }
  .btn.primary { background: linear-gradient(180deg, #5b9bff, #2050b2); border-color: #5b9bff; }
  .btn.danger  { background: linear-gradient(180deg, #ff5b5b, #a02020); border-color: #ff5b5b; }
</style>
</head>
<body>
<div class="screen">
  <div class="game-bg"></div>
  <div class="game-shape gs1"></div>
  <div class="game-shape gs2"></div>
  <div class="game-shape gs3"></div>
  <div class="backdrop"></div>
  <div class="modal">
    <div class="m-header"></div>
    <div class="m-body">
      <div class="m-left">
        <div class="m-line"></div>
        <div class="m-line med"></div>
        <div class="m-line"></div>
        <div class="m-line short"></div>
        <div class="m-line med"></div>
        <div class="m-line short"></div>
      </div>
      <div class="m-right"></div>
    </div>
    <div class="m-buttons">
      <div class="btn"></div>
      <div class="btn danger"></div>
      <div class="btn primary"></div>
    </div>
  </div>
</div>
</body>
</html>
