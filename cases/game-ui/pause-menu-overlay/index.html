<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pause-menu-overlay</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2d36; font-size: 0; }
  .screen { width: 800px; height: 600px; position: relative; overflow: hidden; }
  .game { position: absolute; inset: 0; background: linear-gradient(180deg, #2c4d6d, #1a1d26); }
  .terrain { position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; background: linear-gradient(180deg, #3a5d3a, #1f3a1f); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.5; }
  .b1 { top: 100px; left: 200px; width: 80px; height: 80px; background: #ffd84d; }
  .b2 { top: 250px; left: 600px; width: 60px; height: 60px; background: #ff5b5b; }
  .backdrop { position: absolute; inset: 0; background: rgba(10,12,20,0.7); }
  .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 360px; background: #1f2330; border: 2px solid #888; border-radius: 8px; padding: 24px; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .title { width: 280px; height: 40px; background: linear-gradient(90deg, #555, #888, #555); border-radius: 4px; margin-bottom: 12px; }
  .btn { width: 280px; height: 40px; background: linear-gradient(180deg, #3a4050, #1f2330); border: 1px solid #555; border-radius: 4px; }
  .btn.back { background: linear-gradient(180deg, #5b9bff, #2050b2); border-color: #5b9bff; margin-top: 16px; }
  .sep { width: 280px; height: 1px; background: #555; }
</style>
</head>
<body>
<div class="screen">
  <div class="game">
    <div class="terrain"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>
  <div class="backdrop"></div>
  <div class="panel">
    <div class="title"></div>
    <div class="btn"></div>
    <div class="btn"></div>
    <div class="btn"></div>
    <div class="sep"></div>
    <div class="btn"></div>
    <div class="btn back"></div>
  </div>
</div>
</body>
</html>
