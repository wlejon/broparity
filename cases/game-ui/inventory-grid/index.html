<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>inventory-grid</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1d26; font-size: 0; }
  .screen { width: 800px; height: 600px; position: relative; overflow: hidden; }
  .panel { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 560px; padding: 16px; background: linear-gradient(180deg, #2c303a, #1a1d26); border: 2px solid #555; border-radius: 8px; }
  .header { width: 100%; height: 24px; background: #444; border-radius: 4px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(6, 60px); gap: 6px; }
  .slot { background: #14161c; border: 1px solid #444; border-radius: 4px; position: relative; }
  .item { position: absolute; top: 6px; left: 6px; width: 46px; height: 46px; border-radius: 4px; }
  .stack { position: absolute; right: 4px; bottom: 4px; width: 18px; height: 10px; background: #fff; border-radius: 2px; }
  .common { background: linear-gradient(135deg, #888, #555); }
  .rare    { background: linear-gradient(135deg, #5b9bff, #204080); box-shadow: 0 0 6px #5b9bff; }
  .epic    { background: linear-gradient(135deg, #b85bff, #602080); box-shadow: 0 0 8px #b85bff; }
  .legend  { background: linear-gradient(135deg, #ffd84d, #a06020); box-shadow: 0 0 10px #ffd84d; }
  .red     { background: linear-gradient(135deg, #ff5b5b, #802020); }
  .green   { background: linear-gradient(135deg, #5bff8b, #208040); }
</style>
</head>
<body>
<div class="screen">
  <div class="panel">
    <div class="header"></div>
    <div class="grid">
      <div class="slot"><div class="item common"></div></div>
      <div class="slot"><div class="item rare"></div><div class="stack"></div></div>
      <div class="slot"></div>
      <div class="slot"><div class="item epic"></div></div>
      <div class="slot"></div>
      <div class="slot"><div class="item red"></div><div class="stack"></div></div>
      <div class="slot"><div class="item green"></div></div>
      <div class="slot"></div>

      <div class="slot"></div>
      <div class="slot"><div class="item legend"></div></div>
      <div class="slot"><div class="item common"></div></div>
      <div class="slot"></div>
      <div class="slot"><div class="item common"></div><div class="stack"></div></div>
      <div class="slot"></div>
      <div class="slot"><div class="item rare"></div></div>
      <div class="slot"><div class="item green"></div><div class="stack"></div></div>

      <div class="slot"><div class="item red"></div></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"><div class="item common"></div></div>
      <div class="slot"><div class="item epic"></div><div class="stack"></div></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"><div class="item rare"></div></div>

      <div class="slot"></div>
      <div class="slot"><div class="item common"></div></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"><div class="item green"></div></div>
      <div class="slot"></div>
      <div class="slot"></div>

      <div class="slot"><div class="item common"></div></div>
      <div class="slot"></div>
      <div class="slot"><div class="item legend"></div><div class="stack"></div></div>
      <div class="slot"></div>
      <div class="slot"><div class="item red"></div></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>

      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"><div class="item common"></div></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"><div class="item rare"></div></div>
      <div class="slot"></div>
    </div>
  </div>
</div>
</body>
</html>
