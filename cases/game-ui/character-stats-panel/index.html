<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>character-stats-panel</title>
<style>
  html, body { margin: 0; padding: 0; background: #14161c; font-size: 0; }
  .screen { width: 800px; height: 600px; position: relative; overflow: hidden; }
  .panel { position: absolute; top: 40px; left: 40px; width: 720px; height: 520px; background: linear-gradient(180deg, #2c303a, #1a1d26); border: 2px solid #555; border-radius: 8px; display: flex; padding: 20px; box-sizing: border-box; gap: 20px; }
  .left { flex: 0 0 240px; display: flex; flex-direction: column; gap: 12px; }
  .portrait { width: 240px; height: 320px; background: linear-gradient(135deg, #5b9bff, #2050b2); border: 2px solid #888; border-radius: 6px; position: relative; overflow: hidden; }
  .portrait-shine { position: absolute; top: 20px; left: 20px; width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; }
  .name-plate { width: 240px; height: 28px; background: #444; border-radius: 4px; }
  .class-row { display: flex; gap: 6px; }
  .class-icon { width: 36px; height: 36px; border-radius: 50%; }
  .ci-1 { background: linear-gradient(135deg, #ff5b5b, #802020); }
  .ci-2 { background: linear-gradient(135deg, #ffd84d, #806020); }
  .ci-3 { background: linear-gradient(135deg, #5bff8b, #208040); }
  .right { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .stat-header { width: 100%; height: 28px; background: linear-gradient(90deg, #555, #333); border-radius: 4px; margin-bottom: 4px; }
  .stat-row { display: flex; align-items: center; gap: 10px; height: 24px; }
  .s-label { flex: 0 0 90px; height: 12px; background: #555; border-radius: 2px; }
  .s-bar { flex: 1; height: 14px; background: #1a1d26; border: 1px solid #444; border-radius: 2px; padding: 1px; box-sizing: border-box; }
  .s-fill { height: 100%; border-radius: 1px; }
  .s-val { flex: 0 0 40px; height: 12px; background: #888; border-radius: 2px; }
  .red { background: linear-gradient(180deg, #ff5b5b, #a02020); }
  .blue { background: linear-gradient(180deg, #5b9bff, #2050b2); }
  .yellow { background: linear-gradient(180deg, #ffd84d, #a08020); }
  .green { background: linear-gradient(180deg, #5bff8b, #208040); }
  .purple { background: linear-gradient(180deg, #b85bff, #602080); }
</style>
</head>
<body>
<div class="screen">
  <div class="panel">
    <div class="left">
      <div class="portrait"><div class="portrait-shine"></div></div>
      <div class="name-plate"></div>
      <div class="class-row">
        <div class="class-icon ci-1"></div>
        <div class="class-icon ci-2"></div>
        <div class="class-icon ci-3"></div>
      </div>
    </div>
    <div class="right">
      <div class="stat-header"></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill red" style="width:85%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill blue" style="width:60%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill yellow" style="width:40%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill green" style="width:75%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill purple" style="width:30%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill red" style="width:55%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill blue" style="width:90%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill green" style="width:45%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill yellow" style="width:65%"></div></div><div class="s-val"></div></div>
      <div class="stat-row"><div class="s-label"></div><div class="s-bar"><div class="s-fill purple" style="width:50%"></div></div><div class="s-val"></div></div>
    </div>
  </div>
</div>
</body>
</html>
