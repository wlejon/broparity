<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>scoreboard-end-of-match</title>
<style>
  html, body { margin: 0; padding: 0; background: #14161c; font-size: 0; }
  .screen { width: 800px; height: 600px; position: relative; overflow: hidden; }
  .container { position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
  .team { flex: 1; background: #1f2330; border: 2px solid #555; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
  .team-header { width: 100%; height: 32px; }
  .team.a .team-header { background: linear-gradient(90deg, #5b9bff, #2050b2); }
  .team.b .team-header { background: linear-gradient(90deg, #ff5b5b, #802020); }
  .col-header { display: flex; align-items: center; gap: 8px; padding: 4px 12px; height: 22px; background: #2c303a; border-bottom: 1px solid #444; box-sizing: border-box; }
  .ch-cell { height: 10px; background: #888; border-radius: 2px; }
  .ch-name { flex: 2; }
  .ch-stat { flex: 1; }
  .player-rows { flex: 1; display: flex; flex-direction: column; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 4px 12px; height: 36px; box-sizing: border-box; flex: 1; }
  .prow:nth-child(odd) { background: #252836; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; }
  .a1 { background: linear-gradient(135deg, #5b9bff, #204080); }
  .a2 { background: linear-gradient(135deg, #ff5b5b, #802020); }
  .a3 { background: linear-gradient(135deg, #5bff8b, #208040); }
  .a4 { background: linear-gradient(135deg, #ffd84d, #a06020); }
  .a5 { background: linear-gradient(135deg, #b85bff, #602080); }
  .pname { flex: 2; height: 12px; background: #555; border-radius: 2px; }
  .pstat { flex: 1; height: 14px; background: #777; border-radius: 2px; }
</style>
</head>
<body>
<div class="screen">
  <div class="container">
    <div class="team a">
      <div class="team-header"></div>
      <div class="col-header">
        <div class="ch-cell ch-name"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
      </div>
      <div class="player-rows">
        <div class="prow"><div class="avatar a1"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a2"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a3"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a4"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a5"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
      </div>
    </div>
    <div class="team b">
      <div class="team-header"></div>
      <div class="col-header">
        <div class="ch-cell ch-name"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
        <div class="ch-cell ch-stat"></div>
      </div>
      <div class="player-rows">
        <div class="prow"><div class="avatar a2"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a3"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a4"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a5"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
        <div class="prow"><div class="avatar a1"></div><div class="pname"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div><div class="pstat"></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
