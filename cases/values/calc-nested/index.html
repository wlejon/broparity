<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>calc-nested</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; color: #202020; font-size: 16px; }
  #root { width: 400px; margin: 20px; background: #f0f0f0; }
  .box { height: 40px; margin-bottom: 10px; }
  /* 400 - 40 = 360px */
  #b-sub { width: calc(100% - 40px); background: #c0d0e0; }
  /* 200 + 2*16 = 232px */
  #b-em { width: calc(50% + 2em); background: #d0e0c0; }
  /* calc(calc(100px * 2) - 10%) = 200 - 40 = 160px */
  #b-nest { width: calc(calc(100px * 2) - 10%); background: #e0c0d0; }
  /* margin-left: calc(10px - 30px) = -20px, shifts left past the parent edge */
  #b-neg { width: 200px; margin-left: calc(10px - 30px); background: #e0d0a0; }
</style>
</head>
<body>
  <div id="root">
    <div id="b-sub" class="box"></div>
    <div id="b-em" class="box"></div>
    <div id="b-nest" class="box"></div>
    <div id="b-neg" class="box"></div>
  </div>
</body>
</html>
